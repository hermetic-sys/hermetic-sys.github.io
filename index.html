<script type="text/plain" id="doc-cli-reference">
# CLI Reference

Single ~9 MB binary, 28 subcommands. All commands accept `--env <n>` to select a named environment (default: `default`).

```bash
hermetic [--env <n>] <command> [options]
```

Community Edition supports 1 environment (`default`). Multiple environments require a [commercial license](https://hermeticsys.com/license).

---

## Global Flags

| Flag | Description |
|------|-------------|
| `--env <n>` | Named environment (default: `default`). Each environment has its own vault, daemon, and audit log. |
| `--vault-path <path>` | Legacy: explicit vault path. Deprecated — use `--env` instead. |
| `--socket-path <path>` | Legacy: explicit socket path. Deprecated — use `--env` instead. |

---

## Setup & Vault

### init

Create a new vault.

```bash
hermetic init                    # Standard: create vault, prompt for passphrase
hermetic init --quickstart       # Guided: vault + .env import + daemon + MCP config
```

The `--quickstart` flag orchestrates the full first-time experience in one command: passphrase collection, vault creation (Argon2id ~18s), `.env` file detection with template matching, daemon startup, credential verification, and MCP tool configuration.

**Access pattern:** Direct (no daemon required).

---

### add

Store a secret in the vault.

```bash
hermetic add --wizard                                    # Interactive: auto-detect service
echo -n "sk-proj-..." | hermetic add openai-key \        # Explicit: from stdin
  --allowed-domains api.openai.com \
  --auth-scheme bearer \
  --sensitivity high
```

| Flag | Description |
|------|-------------|
| `--wizard` | Interactive mode. Prompts for name, reads secret with no echo, detects service from key prefix patterns, auto-configures domains and auth scheme. |
| `--allowed-domains <domains>` | Comma-separated list of domains this secret can be sent to. Vault-authoritative — agents cannot override. |
| `--auth-scheme <scheme>` | One of: `bearer`, `basic`, `x-api-key`, `header:<n>`. |
| `--sensitivity <level>` | Metadata tag: `low`, `medium`, `high`. Does not affect encryption (all secrets use AES-256-GCM). |

Secret values are read from stdin. Never passed as command arguments (would appear in `ps`, `/proc/*/cmdline`, shell history).

**Access pattern:** Direct (vault unlocked via passphrase).

---

### remove

Delete a secret from the vault.

```bash
hermetic remove openai-key
```

Removes the secret and its metadata. Active handles for this secret will fail at redemption (HC-10 fingerprint mismatch).

**Access pattern:** Direct.

---

### list

Show secret metadata.

```bash
hermetic list                    # Full metadata: names, domains, auth schemes
hermetic list --count            # Number only (for shell prompt integration)
```

Never shows secret values.

**Access pattern:** Direct.

---

### import

Import secrets from a `.env` file.

```bash
hermetic import --path .env                              # Import all keys
hermetic import --path .env --dry-run                    # Preview without storing
hermetic import --path .env --allowed-domains api.example.com --auth-scheme bearer
```

| Flag | Description |
|------|-------------|
| `--path <file>` | Path to `.env` file. Maximum 5 MiB. |
| `--dry-run` | Show what would be imported without storing. |
| `--allowed-domains <domains>` | Default domains for keys without template matches. |
| `--auth-scheme <scheme>` | Default auth scheme for keys without template matches. |

Parses `KEY=value` lines. Strips `export` prefix, surrounding quotes, and trailing whitespace (CRLF-safe). Rejects keys containing characters outside `[A-Za-z0-9_]`. Rejects values containing null bytes. Warns and skips duplicates. Auto-matches keys against 19 service templates (e.g., `ANTHROPIC_API_KEY` → Anthropic template).

**Access pattern:** Direct.

---

### templates

List or inspect built-in service templates.

```bash
hermetic templates                    # List all 19 templates
hermetic templates anthropic          # Show details for one template
```

Each template provides: `display_name`, `allowed_domains`, `auth_scheme`, `default_secret_name`, `test_url`, `test_method`, and `hint` (URL where the user can find their API key). Templates are embedded at compile time via `include_str!` — no runtime file access.

**Available services:** Anthropic, OpenAI, Mistral, Cohere, Replicate, Stripe, Twilio, SendGrid, Mailgun, Slack, GitHub, GitLab, Datadog, PagerDuty, Cloudflare, Vercel, Supabase, Linear, Notion.

---

### status

Show vault and daemon information.

```bash
hermetic status                  # One-time status
hermetic status --watch          # Continuous refresh (5-second interval)
hermetic status --watch --interval 10
```

Displays: vault state, daemon PID, secret count, memory locked status, hardening state, last request summary, audit chain status.

---

## Daemon & Session

### start

Start the daemon in the background.

```bash
hermetic start                           # Standard: prompt for passphrase
hermetic start --remember-session        # Save encrypted session for reboot recovery
```

Applies OS hardening (mlockall, privilege restriction, ptrace protection) before accepting connections. Writes PID file to `~/.hermetic/<env>/daemon.pid`.

The `--remember-session` flag encrypts the passphrase (not the master key) with a session key derived from `install_secret + machine_id + boot_id + hostname + UID`. Session expires after 7 days. Destroyed on `hermetic stop` or `hermetic seal`.

**Access pattern:** Interactive (passphrase from /dev/tty).

---

### stop

Stop the daemon and destroy the session file.

```bash
hermetic stop
```

Sends SIGTERM to the daemon process. Destroys the session file (zero-overwrite + delete). All active handles are invalidated.

---

### restart

Stop and start the daemon.

```bash
hermetic restart
hermetic restart --remember-session
```

Equivalent to `hermetic stop` followed by `hermetic start`.

---

### daemon

Run the daemon in the foreground (for debugging).

```bash
hermetic daemon
```

Same behavior as `start` but does not daemonize. Output goes to the terminal. Ctrl+C to stop. Useful for debugging socket and hardening issues.

**Access pattern:** Interactive (passphrase from /dev/tty).

---

### daemon-status

Check if the daemon is running.

```bash
hermetic daemon-status               # Human-readable output
hermetic daemon-status --quiet       # Exit code only (for scripts)
```

Exit codes: `0` = running, `1` = not running. The `--quiet` flag suppresses all output — designed for shell prompt integration and health checks.

---

### seal

Lock the vault and destroy all session material.

```bash
hermetic seal
```

Immediately zeroizes all key material in the daemon's memory, invalidates all active handles, and destroys the session file. The daemon remains running but all operations return denial responses until the vault is re-unlocked. Requires an interactive terminal (SM-5a: isatty gate).

Use this if you suspect compromise.

**Access pattern:** Interactive (requires terminal).

---

## Operations

### request

Make an authenticated HTTP request via the daemon.

```bash
hermetic request --secret openai-key \
  --url https://api.openai.com/v1/models \
  --method GET

hermetic request --secret stripe-key \
  --url https://api.stripe.com/v1/charges \
  --method POST \
  --body '{"amount": 2000, "currency": "usd"}' \
  --header "Content-Type: application/json"
```

| Flag | Description |
|------|-------------|
| `--secret <n>` | Secret to use for authentication. |
| `--url <url>` | Target URL (must be HTTPS — HC-1). |
| `--method <method>` | HTTP method (default: GET). |
| `--body <data>` | Request body. |
| `--header <key: value>` | Additional header (repeatable). 12 forbidden headers stripped — HC-7. |

Uses the full handle protocol: issue → redeem → inject → transport → zeroize. ★★★ BROKERED tier. SSRF protection and domain binding enforced.

**Access pattern:** Daemon (UDS handle protocol).

---

### verify

Test whether a stored credential is valid.

```bash
hermetic verify openai-key                    # Use template test_url
hermetic verify openai-key --url https://api.openai.com/v1/models
```

Makes a probe request to the service's test endpoint using the full handle protocol pipeline. Reports:

- `✓ HTTP 200` — credential is valid
- `✗ HTTP 401` — credential rejected
- `✗ HTTP 403` — credential lacks permissions

Uses the same transport pipeline as `request` (shared internal helper) — SSRF protection cannot be accidentally bypassed.

**Access pattern:** Daemon.

---

### exec

Run a command with a secret injected as an environment variable.

```bash
hermetic exec --secret deploy-token -- ./deploy.sh
hermetic exec --secret db-password --env-var DATABASE_URL -- ./migrate.sh
```

| Flag | Description |
|------|-------------|
| `--secret <n>` | Secret to inject. |
| `--env-var <n>` | Environment variable name (default: secret name uppercased). |
| `-- <command> [args...]` | Command and arguments to execute. |

**Security tier:** ★★ TRANSIENT. The secret exists in the child process environment for its lifetime. `/proc/<pid>/environ` is readable by same-UID processes (V1-LIM-1).

**Differences from MCP env_spawn:** `exec` inherits the parent environment (M-6 — parent shell is a trusted boundary). MCP `env_spawn` uses `env_clear` (untrusted agent environment). HC-8 binary blocklist applies to both.

**Access pattern:** Daemon.

---

## Integration & Tools

### mcp

Run the MCP JSON-RPC bridge over stdio.

```bash
hermetic mcp
```

Speaks JSON-RPC 2.0 on stdin/stdout. All diagnostics go to stderr (MCP-5: stdout purity). Exposes 5 tools: `hermetic_authenticated_request`, `hermetic_store_secret`, `hermetic_list_secrets`, `hermetic_env_spawn`, `hermetic_seal_vault`.

Typically launched by an MCP client (Claude Code, Cursor, Windsurf), not run directly. See the [MCP Integration Guide](mcp-integration.md).

**Access pattern:** Daemon (UDS connection to running daemon).

---

### mcp-config

Generate MCP server configuration for AI platforms.

```bash
hermetic mcp-config --target claude-code                 # Print command
hermetic mcp-config --target claude-code --install       # Auto-register
hermetic mcp-config --target cursor                      # JSON for .cursor/mcp.json
hermetic mcp-config --target windsurf                    # JSON for .windsurf/mcp.json
hermetic mcp-config --target vscode                      # JSON for .vscode/mcp.json
hermetic mcp-config --target claude-desktop              # JSON for Claude Desktop config
```

| Target | Output | Config Location |
|--------|--------|-----------------|
| `claude-code` | `claude mcp add` command | Claude Code internal registry |
| `cursor` | `mcpServers` JSON | `.cursor/mcp.json` |
| `windsurf` | `mcpServers` JSON | `.windsurf/mcp.json` |
| `vscode` | `servers` JSON (type: stdio) | `.vscode/mcp.json` |
| `claude-desktop` | `mcpServers` JSON | `~/.config/Claude/` (Linux) |

JSON goes to stdout (machine-parseable). Instructions go to stderr (human-readable). The `--install` flag (Claude Code only) auto-registers via `claude mcp add`.

---

### onboard

Generate agent integration documentation.

```bash
hermetic onboard                                         # Output to current directory
hermetic onboard --output-dir ./docs                     # Custom output directory
hermetic onboard --target openclaw --output-dir .        # OpenClaw-specific files
```

**Default output:** `CLAUDE.md`, `AGENTS.md`, `SKILL.md` — integration guides for Claude Code, MCP-compatible agents, and agent skill registries.

**OpenClaw output:** `.agent/skills/hermetic/SKILL.md` and `openclaw.secrets.yaml` — exec provider config pointing to `hermetic request` as the credential resolver.

---

### clone-env

Export or import environment metadata for machine migration.

```bash
# On old machine:
hermetic clone-env --export > hermetic-manifest.json

# On new machine:
hermetic clone-env --import hermetic-manifest.json
```

The export manifest contains secret names, domains, auth schemes, and template references — **never secret values**. The manifest is safe to transfer via email, Slack, or any channel. On import, the user is guided through pasting each secret value.

---

### doctor

Run system health diagnostics.

```bash
hermetic doctor
```

Checks: vault existence, daemon PID (via `/proc/<pid>/exe`), socket health, binary integrity, template count, environment directory. Works when the daemon is down — that's the primary scenario when diagnostics are needed.

---

### audit

View and verify the tamper-evident audit log.

```bash
hermetic audit                           # Recent entries
hermetic audit --verify                  # Verify HMAC-SHA256 chain integrity
hermetic audit --secret openai-key       # Filter by secret name
```

Records handle issuance, redemption (success and failure), secret storage, vault seal/unseal, and session events. Records secret *names*, never values. The audit log is CLI-only — deliberately not exposed as an MCP tool (prevents agents from observing credential usage patterns).

**Access pattern:** Direct.

---

### shell-prompt

Output a shell function for prompt integration.

```bash
eval "$(hermetic shell-prompt bash)"     # Bash
eval "$(hermetic shell-prompt zsh)"      # Zsh
eval "$(hermetic shell-prompt fish)"     # Fish
```

Adds a prompt segment: `(hermetic:✓ 5)` when the daemon is running with 5 secrets, `(hermetic:✗)` when down. Uses `hermetic daemon-status --quiet` internally — exit code only, no stdout.

---

### migrate

Migrate a legacy vault to a named environment.

```bash
hermetic migrate --from ./old-vault-dir
```

Copies vault data from a legacy `--path`-based layout to the `~/.hermetic/<env>/` structure. Use this when upgrading from the pre-unified-binary era.

---

### version

Print version information.

```bash
hermetic version
```

---

## Exit Codes

| Code | Meaning |
|------|---------|
| `0` | Success |
| `1` | General error (check stderr for details) |
| `2` | Usage error (invalid flags or arguments) |

Every error message includes a fix hint — the command to resolve the issue. See `hermetic doctor` for comprehensive diagnostics.

---

## Environment Variables

Hermetic does not read secrets from environment variables. The daemon collects passphrases from `/dev/tty` only — never from stdin, env, or arguments.

The following environment variables affect behavior:

| Variable | Effect |
|----------|--------|
| `HERMETIC_ENV` | Default environment name (overridden by `--env`). |
| `NO_COLOR` | Disable colored terminal output (per [no-color.org](https://no-color.org)). |
| `RUST_LOG` | Tracing filter (development/debugging only). |

</script>

# License FAQ

Hermetic is licensed under the [GNU Affero General Public License v3](../LICENSE) (AGPL-3.0-or-later). Commercial licenses are available for organizations that need AGPL obligation waivers. This page answers the questions we hear most.

---

## Do I need a commercial license?

**Probably not.** Most users don't.

You do **NOT** need a commercial license if you:

- Use Hermetic unmodified, for any purpose, at any scale — personal, startup, enterprise.
- Use Hermetic alongside your application as a separate process (the AGPL applies to Hermetic, not to software that communicates with it over a socket or stdio).
- Contribute to the open-source project under the [CLA](../CONTRIBUTING.md).
- Conduct security research, auditing, or evaluation.

You **DO** need a commercial license if you:

- **Modify Hermetic's source code AND deploy those modifications as part of a network service** without publishing your changes. This is the AGPL network clause — the only AGPL obligation that goes beyond standard GPL.
- **Your organization's legal policy prohibits AGPL software** in production, regardless of how you use it. Some compliance teams blanket-block AGPL. A commercial license resolves this.
- **You need expanded operational limits** — more than 1 named environment or audit export capability.

---

## What triggers the AGPL network clause?

The AGPL network clause (Section 13) requires that if you modify Hermetic and make it available to users interacting with it over a network, you must offer those users the source code of your modified version.

**"Modify" means changing Hermetic's source code.** Using Hermetic unmodified — even running it as part of a larger system — does not trigger the clause.

**"Network interaction" means users interact with your modified Hermetic over a computer network.** If you run a modified Hermetic daemon that only you access locally, the clause doesn't apply. If you run it as part of a service that external users interact with, it does.

Using Hermetic's MCP tools from an AI agent is not network interaction with Hermetic — the agent communicates via local stdio, not over a network.

---

## Does the AGPL infect my application?

No. The AGPL applies to Hermetic and works derived from it. Your application communicates with Hermetic over a Unix domain socket (daemon) or stdio pipe (MCP). These are standard inter-process communication boundaries — your application is a separate work under copyright law.

If you copy Hermetic's source code into your application, that creates a derivative work and the AGPL applies to the combined work. If you communicate with Hermetic as a separate process, it does not.

---

## What are the Community Edition limits?

The Community Edition is free forever and enforces three limits via constitutional amendments:

| Limit | Amendment | What Happens |
|-------|-----------|-------------|
| 1 named environment | CL-1 | Creating a second environment returns a clear error. |
| 1 named environment (`default`) | CL-1 | Creating or using a non-default environment returns an error. |
| Audit tracking only (no export) | CL-2 | Audit log is viewable but cannot be exported. Export available in commercial tiers (V1.1). |

A Community Edition banner appears on daemon stderr and in the MCP `initialize` response (CL-3). This does not affect functionality.

**All limits fail open.** A corrupt or missing license key defaults to Community behavior. An expired license reverts to Community limits. Your vault, secrets, and audit log remain intact. You never lose data — you lose expanded limits.

---

## What does a commercial license include?

1. **AGPL obligation waiver** — use, modify, and deploy without source disclosure.
2. **Expanded limits** — per your tier (Startup: unlimited secrets, 5 environments, 30-day audit. Enterprise: unlimited everything).
3. **Offline license key** — HMAC-SHA256 `license.key` file. No internet required, no telemetry, no phone-home.
4. **Support** — email with 48-hour response (Startup) or SLA-bound dedicated support (Enterprise).

---

## How much does it cost?

| Tier | Price | Secrets | Environments | Audit Retention |
|------|-------|---------|--------------|-----------------|
| Community | Free forever | 10 | 1 | 7 days |
| Startup | $499/year | Unlimited | 5 | 30 days |
| Enterprise | [Contact us](mailto:license@hermeticsys.com) | Unlimited | Unlimited | Unlimited |

The license is per-organization, not per-machine. All employees, contractors, and CI/CD systems within the licensed organization are covered.

---

## Are any security features gated behind the commercial license?

No. Every security property is identical across all tiers:

- Vault encryption (Argon2id, AES-256-GCM, SQLCipher)
- Handle protocol (256-bit, single-use, UID-bound, domain-bound, version-fingerprinted)
- SSRF protection (22 blocked IP ranges, DNS pinning, redirect re-validation)
- OS hardening (mlockall, PR_SET_DUMPABLE, privilege restriction — all FATAL)
- All 41 constitutional amendments
- Python SDK with 10 escape-hatch blocks
- MCP bridge with 5 tools and stdout purity
- HMAC-SHA256 tamper-evident audit chain
- Session persistence

This is a permanent commitment. No security feature will ever be used as a commercial differentiator.

---

## What happens if my license expires?

Hermetic reverts to Community Edition limits. Your vault, secrets, and audit log remain intact and accessible. You can renew at any time to restore expanded limits. An expired license never causes data loss, crashes, or vault corruption.

---

## Can I evaluate Hermetic commercially before purchasing?

Yes. The Community Edition is fully functional for evaluation with unlimited secrets and 1 environment. No time limit, no registration, no credit card. This is sufficient for proof-of-concept testing with real workflows.

---

## Can I use the Community Edition in production?

Yes, under the AGPL. If you use Hermetic unmodified, you have no source disclosure obligations beyond making the original AGPL source available (which it already is, on GitHub). If you modify it and deploy as a network service, you must publish your modifications.

---

## Is there a free tier for open-source projects?

The Community Edition is already AGPL and free forever. Open-source projects can use it without restriction. If your OSS project needs multiple environments or audit export, contact [license@hermeticsys.com](mailto:license@hermeticsys.com) — we offer free Startup licenses for qualifying open-source projects.

---

## Can I redistribute Hermetic with my product?

Under the AGPL: yes, with full source disclosure and AGPL compliance for the Hermetic component. Under a commercial license: yes, without source disclosure, subject to your license agreement. For OEM or embedding use cases, email [license@hermeticsys.com](mailto:license@hermeticsys.com).

---

## Who owns Hermetic?

Hermetic is published by The Hermetic Project. Copyright is held by the project, not by individual contributors (all contributors sign a [CLA](../CONTRIBUTING.md) that assigns copyright).

---

## Where can I get a commercial license?

**Startup ($499/year):** Email [license@hermeticsys.com](mailto:license@hermeticsys.com). Payment via Stripe. License key delivered within 24 hours.

**Enterprise (custom):** Email [license@hermeticsys.com](mailto:license@hermeticsys.com) with your requirements.

**Questions:** If you're not sure whether you need a commercial license, ask. We'll tell you honestly — if you don't need one, we'll say so.

function ZeroizeString({active}){
  const secret='sk-proj-a8Kx9mQ2nR';
  const[display,setDisplay]=useState(secret);
  const[done,setDone]=useState(false);
  useEffect(function(){
    if(!active){setDisplay(secret);setDone(false);return}
    var chars=secret.split('');var idx=0;
    var iv=setInterval(function(){
      if(idx>=chars.length){clearInterval(iv);setDone(true);return}
      chars[idx]='0';setDisplay(chars.join(''));idx++;
    },80);
    return function(){clearInterval(iv)};
  },[active]);
  return React.createElement('span',{style:{fontFamily:'var(--mn)',fontSize:11,letterSpacing:1,color:done?'var(--green)':active?'var(--red)':'var(--t3)',transition:'color 0.3s'}},done?'0'.repeat(secret.length):display);
}

function mdToHtml(md){
  let h=md;
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){return'<pre><code>'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre>'});
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/^---$/gm,'<hr/>');
  h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  // Tables
  var lines=h.split('\n'),out=[],inTable=false,headerDone=false;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^\|(.+)\|$/.test(ln)){
      var cells=ln.split('|').filter(function(c){return c.trim()});
      if(cells.every(function(c){return/^[\s:-]+$/.test(c)})){headerDone=true;continue}
      if(!inTable){out.push('<table>');inTable=true;headerDone=false}
      var tag=(!headerDone&&inTable)?'th':'td';
      out.push('<tr>'+cells.map(function(c){return'<'+tag+'>'+c.trim()+'</'+tag+'>'}).join('')+'</tr>');
      if(!headerDone)headerDone=true;
    } else {
      if(inTable){out.push('</table>');inTable=false;headerDone=false}
      out.push(ln);
    }
  }
  if(inTable)out.push('</table>');
  h=out.join('\n');
  // Lists
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,function(b){return'<ul>'+b+'</ul>'});
  // Paragraphs
  h=h.replace(/^(?!<[hupoltbr]|$)(.+)$/gm,'<p>$1</p>');
  h=h.replace(/<p><\/p>/g,'');
  return h;
}
