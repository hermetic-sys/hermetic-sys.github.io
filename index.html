<style>
:root{--bg:#08090d;--card:#161824;--card-h:#181a24;--bdr:#2e3050;--bdr-g:#2a3060;--t1:#f5f6fa;--t2:#b8bfd6;--t3:#8890ac;--blue:#4a7cff;--cyan:#36d6c8;--green:#3edd8a;--orange:#ff8a4c;--red:#ff4c6a;--purple:#9366ff;--gold:#ffd166;--g-blue:rgba(74,124,255,0.15);--g-cyan:rgba(54,214,200,0.12);--g-green:rgba(62,221,138,0.12);--g-red:rgba(255,76,106,0.12);--g-purple:rgba(147,102,255,0.12);--g-gold:rgba(255,209,102,0.12);--hd:'Outfit',sans-serif;--mn:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--hd);font-size:16px}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(74,124,255,0.03) 1px,transparent 1px),linear-gradient(rgba(74,124,255,0.03) 1px,transparent 1px);background-size:60px 60px;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(74,124,255,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(54,214,200,0.04) 0%,transparent 50%);z-index:0;pointer-events:none}
#root{position:relative;z-index:1}.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px}
.crd{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:border-color 0.3s,transform 0.2s,box-shadow 0.3s}
.bloom{cursor:pointer;transition:all 0.25s}.bloom:hover{box-shadow:0 0 20px rgba(74,124,255,0.12),0 0 40px rgba(54,214,200,0.06);border-color:var(--bdr-g)!important;transform:translateY(-2px)}
.bloom-gold:hover{box-shadow:0 0 20px rgba(255,209,102,0.18)}.bloom-red:hover{box-shadow:0 0 20px rgba(255,76,106,0.18)}.bloom-green:hover{box-shadow:0 0 20px rgba(62,221,138,0.18)}.bloom-purple:hover{box-shadow:0 0 20px rgba(147,102,255,0.18)}.bloom-cyan:hover{box-shadow:0 0 20px rgba(54,214,200,0.18)}
.tag{font-family:var(--mn);font-size:14px;padding:3px 10px;border-radius:6px;border:1px solid;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.code-blk{background:#0d0e14;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin:12px 0}
.code-hd{background:rgba(255,255,255,0.03);padding:8px 14px;font-family:var(--mn);font-size:14px;color:var(--t3);display:flex;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.code-bd{padding:14px 16px;font-family:var(--mn);font-size:15px;line-height:1.7;overflow-x:auto;white-space:pre;color:var(--t2)}
.code-bd .k{color:var(--purple)}.code-bd .s{color:var(--green)}.code-bd .c{color:var(--t3);font-style:italic}.code-bd .n{color:var(--cyan)}.code-bd .v{color:var(--orange)}.code-bd .g{color:var(--gold)}.code-bd .r{color:var(--red)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.fbx{padding:8px 14px;border-radius:8px;font-family:var(--mn);font-size:15px;font-weight:500;border:1px solid}
.fbx-p{background:rgba(74,124,255,0.08);border-color:rgba(74,124,255,0.25);color:var(--blue)}.fbx-s{background:rgba(147,102,255,0.08);border-color:rgba(147,102,255,0.25);color:var(--purple)}.fbx-c{background:rgba(54,214,200,0.08);border-color:rgba(54,214,200,0.25);color:var(--cyan)}.fbx-r{background:rgba(255,76,106,0.08);border-color:rgba(255,76,106,0.25);color:var(--red)}.fbx-g{background:rgba(62,221,138,0.08);border-color:rgba(62,221,138,0.25);color:var(--green)}.fbx-o{background:rgba(255,138,76,0.08);border-color:rgba(255,138,76,0.25);color:var(--orange)}
.farw{color:var(--t3);font-size:18px}
/* TOPNAV — increased height */
.topnav{position:sticky;top:0;z-index:100;background:rgba(10,11,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:0 24px}
.topnav-in{max-width:1120px;margin:0 auto;height:68px;display:flex;align-items:center;justify-content:space-between}
.nav-tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-width:0;margin-left:20px}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:10px 18px;font-size:16px;font-weight:500;color:var(--t3);border-radius:8px;cursor:pointer;transition:all 0.2s;white-space:nowrap;border:none;background:none;font-family:var(--hd)}
.nav-tab:hover{color:var(--t2);background:rgba(255,255,255,0.04)}
.nav-tab.active{color:var(--t1);background:rgba(74,124,255,0.12)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.sub-tab{padding:8px 16px;font-size:15px;font-weight:500;color:var(--t3);border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;font-family:var(--hd);transition:all 0.2s}
.sub-tab:hover{color:var(--t2);background:rgba(255,255,255,0.04)}
.sub-tab.active{color:var(--t1);background:rgba(74,124,255,0.1);border-color:rgba(74,124,255,0.3)}
/* Pipeline step classes — from v3 */
.step{display:grid;grid-template-columns:72px 1fr;gap:0}.step-marker{display:flex;flex-direction:column;align-items:center}
.step-num{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-weight:700;font-size:18px;border:2px solid;z-index:2;flex-shrink:0;transition:transform 0.3s}.step:hover .step-num{transform:scale(1.15)}
.step-line{width:2px;flex:1;min-height:20px;z-index:1}.step-body{padding:0 0 32px 20px}
.step-lbl{font-size:16px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.step-ttl{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:8px}
.step-desc{font-size:16px;color:var(--t2);line-height:1.6;margin-bottom:12px;max-width:700px}
/* timeline bar */
.tl-bar-wrap{height:30px;background:rgba(255,255,255,0.02);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--bdr)}.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-size:14px;font-weight:600;animation:barGrow 1s ease-out both}
.shimmer-line{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);background-size:200% 100%;animation:shimmer 3s ease-in-out infinite;border-radius:1px;margin:20px 0}
.gradient-border{position:relative;overflow:hidden}
.gradient-border::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green),var(--gold),var(--purple),var(--blue));background-size:200% 100%;animation:gradientShift 4s linear infinite}
/* Burger & Drawer */
.burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;background:none;border:1px solid var(--bdr);border-radius:8px;cursor:pointer;padding:10px;flex-shrink:0}
.burger span{display:block;height:2px;background:var(--t2);border-radius:1px;transition:all 0.25s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.open span:nth-child(2){opacity:0}.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;backdrop-filter:blur(4px)}.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;transform:translateX(105%);width:min(300px,85vw);height:100%;background:#12131a;border-left:1px solid var(--bdr);z-index:201;transition:transform 0.3s;overflow-y:auto;padding:0 0 40px}.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr)}
.drawer-close{width:32px;height:32px;background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-item{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;background:none;border:none;border-bottom:1px solid rgba(30,32,48,0.5);color:var(--t2);font-size:16px;font-family:var(--hd);cursor:pointer;text-align:left;transition:background 0.15s}.drawer-item:active{background:rgba(255,255,255,0.06)}.drawer-item.active{color:var(--t1);background:rgba(74,124,255,0.1)}
.sec{padding:60px 0}.sec-hd{margin-bottom:32px}
.sec-hd h2{font-size:clamp(24px,3.5vw,36px);font-weight:800;letter-spacing:-0.5px;line-height:1.15;margin-bottom:12px}
.sec-hd p{font-size:18px;color:var(--t2);line-height:1.6;max-width:680px}
.sec-label{font-family:var(--mn);font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}.sec-label::before,.sec-label::after{content:'';flex:0 0 30px;height:1px}
.tip{position:relative;cursor:help;border-bottom:1px dashed currentColor;display:inline}.tip .tip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);min-width:220px;max-width:340px;padding:10px 14px;background:#1a1c28;border:1px solid var(--bdr-g);border-radius:8px;font-size:14px;font-weight:400;color:var(--t2);line-height:1.5;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.5);font-family:var(--hd);white-space:normal;letter-spacing:0;text-transform:none}.tip .tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1a1c28}.tip:hover .tip-box{display:block;animation:fadeIn 0.15s}
/* Zeroize animation */
@keyframes sealFloat{0%,100%{transform:scale(1);filter:invert(1) brightness(0.85) drop-shadow(0 0 6px rgba(255,76,106,0.4))}50%{transform:scale(1.04);filter:invert(1) brightness(0.95) drop-shadow(0 0 10px rgba(255,76,106,0.6))}}
@keyframes zeroizeFlash{0%{opacity:1;filter:brightness(1)}15%{filter:brightness(2.5) saturate(0)}30%{opacity:0.6;filter:brightness(1.8) saturate(0.3)}60%{opacity:0.3}100%{opacity:0;filter:brightness(0)}}
.seal-zeroize{animation:zeroizeFlash 1.2s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes barGrow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.anim-up{animation:fadeUp 0.6s ease-out both}.d1{animation-delay:0.1s}.d2{animation-delay:0.2s}.d3{animation-delay:0.3s}.d4{animation-delay:0.4s}.d5{animation-delay:0.5s}
@media(max-width:768px){
  .burger{display:flex}.nav-tabs{display:none}.topnav{padding:0 16px}.topnav-in{gap:8px;height:56px}
  .wrap{padding:0 16px}.sec{padding:36px 0}.sec-hd p{font-size:16px}
  .code-bd{font-size:13px;padding:10px 12px}.code-hd{font-size:13px}
  .step{grid-template-columns:48px 1fr}.step-num{width:36px;height:36px;font-size:14px}.step-body{padding:0 0 24px 12px}.step-desc{font-size:14px}
  .sec-label{font-size:13px;letter-spacing:2px}.sub-tabs{gap:3px}.sub-tab{padding:6px 12px;font-size:13px}
  .tip .tip-box{left:0;transform:none;max-width:calc(100vw - 48px)}.tip .tip-box::after{left:16px;transform:none}
}
</style>
</head>

  const map={start:GetStartedSection,security:SecuritySection,proof:ProofSection,pricing:PricingSection,v2:V2Section};const Comp=map[section];
  return(<div>
    <nav className="topnav"><div className="topnav-in">

    <div className={'drawer-overlay'+(menuOpen?' open':'')}onClick={closeMenu}/>

      <button className={'drawer-item'+(section===null?' active':'')}onClick={()=>navTo(null)}>🏠 Home</button>
      {SECTIONS.map(s=>(<button key={s.id}className={'drawer-item'+(section===s.id?' active':'')}onClick={()=>navTo(s.id)}>{s.icon} {s.name}</button>))}
    </div>
    <div className="wrap">

        <button className="nav-tab"onClick={()=>navTo(null)}style={{color:'var(--t1)'}}>← Home</button>

        <div style={{display:'inline-flex',alignItems:'center',gap:10,padding:'10px 18px',background:'var(--card)',border:'1px solid var(--bdr-g)',borderRadius:100,fontFamily:'var(--mn)',fontSize:14,color:'var(--t2)',marginBottom:12}}>

        </div>
        <div style={{fontSize:15,color:'var(--t3)'}}>Built under HAIG governance · Human Constitutional Authority · AI Architect · AI Auditor · AI Executor</div>
      </footer>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
