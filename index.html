<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" defer></script>
<style>
:root{--bg:#08090d;--card:#161824;--card-h:#181a24;--bdr:#2e3050;--bdr-g:#2a3060;--t1:#f5f6fa;--t2:#b8bfd6;--t3:#9350ac;--blue:#4a7cff;--cyan:#36d6c8;--green:#3edd8a;--orange:#ff8a4c;--red:#ff4c6a;--purple:#9366ff;--gold:#ffd166;--g-blue:rgba(74,124,255,0.15);--g-cyan:rgba(54,214,200,0.12);--g-green:rgba(62,221,138,0.12);--g-red:rgba(255,76,106,0.12);--g-purple:rgba(147,102,255,0.12);--g-gold:rgba(255,209,102,0.12);--hd:'Outfit',sans-serif;--mn:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--hd);font-size:14px}
::selection{background:rgba(54,214,200,0.2);color:var(--t1)}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(74,124,255,0.03) 1px,transparent 1px),linear-gradient(rgba(74,124,255,0.03) 1px,transparent 1px);background-size:60px 60px;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(74,124,255,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(54,214,200,0.04) 0%,transparent 50%);z-index:0;pointer-events:none}
#root{position:relative;z-index:1}
a{transition:opacity 0.2s}a:hover{opacity:0.85}.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px}
html{scroll-behavior:smooth}
th{font-family:var(--mn);font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
button,.bloom,.sub-tab,[style*="cursor:pointer"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.crd{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:border-color 0.3s,transform 0.2s,box-shadow 0.3s;contain:content}
.bloom{cursor:pointer;transition:all 0.25s}.bloom:hover{box-shadow:0 0 20px rgba(74,124,255,0.12),0 0 40px rgba(54,214,200,0.06);border-color:var(--bdr-g)!important;transform:translateY(-2px)}
.bloom-gold:hover{box-shadow:0 0 20px rgba(255,209,102,0.18)}.bloom-red:hover{box-shadow:0 0 20px rgba(255,76,106,0.18)}.bloom-green:hover{box-shadow:0 0 20px rgba(62,221,138,0.18)}.bloom-purple:hover{box-shadow:0 0 20px rgba(147,102,255,0.18)}.bloom-cyan:hover{box-shadow:0 0 20px rgba(54,214,200,0.18)}
.tag{font-family:var(--mn);font-size:16px;padding:3px 10px;border-radius:6px;border:1px solid;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.code-blk{background:#0d0e14;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin:12px 0}
.code-hd{background:rgba(255,255,255,0.03);padding:8px 14px;font-family:var(--mn);font-size:16px;color:var(--t3);display:flex;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.code-bd{padding:14px 16px;font-family:var(--mn);font-size:17px;line-height:1.7;overflow-x:auto;white-space:pre;color:var(--t2)}
.code-bd .k{color:var(--purple)}.code-bd .s{color:var(--green)}.code-bd .c{color:var(--t3);font-style:italic}.code-bd .n{color:var(--cyan)}.code-bd .v{color:var(--orange)}.code-bd .g{color:var(--gold)}.code-bd .r{color:var(--red)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.fbx{padding:8px 14px;border-radius:8px;font-family:var(--mn);font-size:17px;font-weight:500;border:1px solid}
.fbx-p{background:rgba(74,124,255,0.08);border-color:rgba(74,124,255,0.25);color:var(--blue)}.fbx-s{background:rgba(147,102,255,0.08);border-color:rgba(147,102,255,0.25);color:var(--purple)}.fbx-c{background:rgba(54,214,200,0.08);border-color:rgba(54,214,200,0.25);color:var(--cyan)}.fbx-r{background:rgba(255,76,106,0.08);border-color:rgba(255,76,106,0.25);color:var(--red)}.fbx-g{background:rgba(62,221,138,0.08);border-color:rgba(62,221,138,0.25);color:var(--green)}.fbx-o{background:rgba(255,138,76,0.08);border-color:rgba(255,138,76,0.25);color:var(--orange)}
.farw{color:var(--t3);font-size:16px}
/* TOPNAV — increased height */
.topnav{position:sticky;top:0;z-index:100;background:rgba(10,11,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:0 24px}
.topnav-in{max-width:1120px;margin:0 auto;height:68px;display:flex;align-items:center;justify-content:space-between}
.nav-tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-width:0;margin-left:20px}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:10px 18px;font-size:14px;font-weight:500;color:var(--t3);border-radius:8px;cursor:pointer;transition:all 0.2s;white-space:nowrap;border:none;background:none;font-family:var(--hd)}
.nav-tab:hover{color:var(--t2);background:rgba(255,255,255,0.04)}
.nav-tab.active{color:var(--t1);background:rgba(74,124,255,0.12)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.sub-tab{padding:8px 16px;font-size:17px;font-weight:500;color:var(--t3);border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;font-family:var(--hd);transition:all 0.2s}
.sub-tab:hover{color:var(--t2);background:rgba(255,255,255,0.04)}
.sub-tab.active{color:var(--t1);background:rgba(74,124,255,0.1);border-color:rgba(74,124,255,0.3)}
/* Pipeline step classes — from v3 */
.step{display:grid;grid-template-columns:72px 1fr;gap:0}.step-marker{display:flex;flex-direction:column;align-items:center}
.step-num{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-weight:700;font-size:16px;border:2px solid;z-index:2;flex-shrink:0;transition:transform 0.3s}.step:hover .step-num{transform:scale(1.15)}
.step-line{width:2px;flex:1;min-height:20px;z-index:1}.step-body{padding:0 0 32px 20px}
.step-lbl{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.step-ttl{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:8px}
.step-desc{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:12px;max-width:700px}
/* timeline bar */
.tl-bar-wrap{height:30px;background:rgba(255,255,255,0.02);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--bdr)}.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-size:16px;font-weight:600;animation:barGrow 1s ease-out both}
.shimmer-line{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);background-size:200% 100%;animation:shimmer 3s ease-in-out infinite;border-radius:1px;margin:20px 0}
.gradient-border{position:relative;overflow:hidden}
.gradient-border::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green),var(--gold),var(--purple),var(--blue));background-size:200% 100%;animation:gradientShift 4s linear infinite}
/* Burger & Drawer */
.burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;background:none;border:1px solid var(--bdr);border-radius:8px;cursor:pointer;padding:10px;flex-shrink:0}
.burger span{display:block;height:2px;background:var(--t2);border-radius:1px;transition:all 0.25s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.open span:nth-child(2){opacity:0}.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;backdrop-filter:blur(4px)}.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;transform:translateX(105%);width:min(300px,85vw);height:100%;background:#12131a;border-left:1px solid var(--bdr);z-index:201;transition:transform 0.3s;overflow-y:auto;padding:0 0 40px}.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr)}
.drawer-close{width:32px;height:32px;background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-item{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;background:none;border:none;border-bottom:1px solid rgba(30,32,48,0.5);color:var(--t2);font-size:14px;font-family:var(--hd);cursor:pointer;text-align:left;transition:background 0.15s}.drawer-item:active{background:rgba(255,255,255,0.06)}.drawer-item.active{color:var(--t1);background:rgba(74,124,255,0.1)}
.sec{padding:60px 0;contain:layout style}.sec-hd{margin-bottom:32px;text-align:center}
.sec-hd h2{font-size:clamp(24px,3.5vw,36px);font-weight:800;letter-spacing:-0.5px;line-height:1.15;margin-bottom:12px}
.sec-hd p{font-size:16px;color:var(--t2);line-height:1.6;max-width:680px;margin:0 auto;text-align:center}
.sec-label{font-family:var(--mn);font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}.sec-label::before,.sec-label::after{content:'';flex:0 0 30px;height:1px}
.tip{position:relative;cursor:help;border-bottom:1px dashed currentColor;display:inline}.tip .tip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);min-width:220px;max-width:340px;padding:10px 14px;background:#1a1c28;border:1px solid var(--bdr-g);border-radius:8px;font-size:16px;font-weight:400;color:var(--t2);line-height:1.5;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.5);font-family:var(--hd);white-space:normal;letter-spacing:0;text-transform:none}.tip .tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1a1c28}.tip:hover .tip-box{display:block;animation:fadeIn 0.15s}
/* Zeroize animation */
@keyframes sealFloat{0%,100%{transform:scale(1);filter:invert(1) brightness(0.9) drop-shadow(0 0 8px rgba(255,76,106,0.5))}50%{transform:scale(1.04);filter:invert(1) brightness(1) drop-shadow(0 0 14px rgba(255,76,106,0.7))}}
@keyframes zeroizeFlash{0%{opacity:1;filter:brightness(1)}15%{filter:brightness(2.5) saturate(0)}30%{opacity:0.6;filter:brightness(1.8) saturate(0.3)}60%{opacity:0.3}100%{opacity:0;filter:brightness(0)}}
.seal-zeroize{animation:zeroizeFlash 1.2s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes panelSlide{from{opacity:0;transform:translateY(40px);clip-path:inset(100% 0 0 0)}to{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes barGrow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.anim-up{animation:fadeUp 0.6s ease-out both;will-change:transform,opacity}.d1{animation-delay:0.1s}.d2{animation-delay:0.2s}.d3{animation-delay:0.3s}.d4{animation-delay:0.4s}.d5{animation-delay:0.5s}
/* ═══ TABLET (≤1024px) ═══ */
@media(max-width:1024px){
  .wrap{padding:0 20px}
  .sec-hd h2{font-size:clamp(22px,3vw,32px)}
}
/* ═══ MOBILE (≤768px) ═══ */
@media(max-width:768px){
  .burger{display:flex}.nav-tabs{display:none}.topnav{padding:0 12px}.topnav-in{gap:8px;height:52px}
  .wrap{padding:0 14px}.sec{padding:28px 0}.sec-hd{margin-bottom:20px}.sec-hd p{font-size:17px}
  .sec-hd h2{font-size:22px}
  .code-bd{font-size:14px;padding:8px 10px}.code-hd{font-size:14px;padding:6px 10px}
  .step{grid-template-columns:40px 1fr}.step-num{width:32px;height:32px;font-size:15px}.step-body{padding:0 0 20px 10px}.step-desc{font-size:15px}.step-ttl{font-size:17px}.step-lbl{font-size:15px}
  .sec-label{font-size:14px;letter-spacing:2px}.sub-tabs{gap:3px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}.sub-tab{padding:6px 10px;font-size:14px;white-space:nowrap;flex-shrink:0}
  .sub-tabs::-webkit-scrollbar{display:none}
  .tip .tip-box{left:0;transform:none;max-width:calc(100vw - 32px)}.tip .tip-box::after{left:16px;transform:none}
  .mob-stack{grid-template-columns:1fr!important}
  .mob-stack-2{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}
  .doc-grid{grid-template-columns:1fr}
  .cta-primary{font-size:17px!important;padding:12px 20px!important}
  .cta-secondary{font-size:16px!important;padding:10px 16px!important}
  .tl-bar-wrap{height:24px}.tl-bar{font-size:12px}
  .shimmer-line{margin:12px 0}
  /* Hero mobile fixes */
  .hero-wrap{padding-top:48px!important;padding-bottom:32px!important}
  /* Full-bleed panel mobile fix */
  .mob-stack>div[style*="borderRight"]{border-right:none!important;border-bottom:1px solid var(--bdr);padding:16px 0!important}
  .mob-stack>div[style*="padding:24px 0 24px 28px"]{padding:16px 0!important}
  .hero-subtitle{font-size:17px!important;margin-bottom:20px!important}
  .hero-tagline{font-size:17px!important}
  .hero-stats{gap:16px!important}
  .hero-stats>div>div:first-child{font-size:24px!important}
  .hero-local-grid{grid-template-columns:1fr 1fr!important}
  .hero-section-nav{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))!important;gap:8px!important}
  /* Proof mobile fixes */
  .proof-kpi{grid-template-columns:1fr 1fr!important}
  .proof-bottom{grid-template-columns:1fr!important}
  /* Pricing mobile */
  .price-val{font-size:28px!important}
}
/* ═══ SMALL PHONE (≤480px) ═══ */
@media(max-width:480px){
  .wrap{padding:0 10px}
  .sec{padding:20px 0}
  .sec-hd h2{font-size:20px}
  .sec-hd p{font-size:16px}
  .mob-stack-2{grid-template-columns:1fr 1fr!important}
  .sub-tab{padding:5px 8px;font-size:12px}
  .doc-grid{grid-template-columns:1fr}
  .hero-wrap{padding-top:36px!important}
  .hero-local-grid{grid-template-columns:1fr!important}
  .hero-section-nav{grid-template-columns:1fr 1fr!important}
  .proof-kpi{grid-template-columns:1fr!important}
}
/* Docs */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.doc-item{padding:24px;cursor:pointer;border-left:3px solid transparent;transition:all 0.25s}
.doc-item:hover{border-left-color:var(--cyan);background:rgba(54,214,200,0.04)!important}
.doc-icon{font-size:28px;margin-bottom:12px}
.doc-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px}
.doc-desc{font-size:16px;color:var(--t3);line-height:1.6;margin-bottom:12px}
.doc-tags{display:flex;gap:6px;flex-wrap:wrap}

# Getting Started with Hermetic

This guide walks you from zero to your first agent-authenticated API request. By the end, you will have a running Hermetic daemon with your API keys stored in an encrypted vault, and an MCP-connected AI agent making authenticated requests without ever seeing your secrets.

**Time required:** 5–10 minutes (including ~18 seconds for key derivation).

**Prerequisites:**
- Linux (Ubuntu 24.04 LTS tested) or WSL2 (Ubuntu 24.04 on Windows 11). Architecture depends on Unix domain sockets, SO_PEERCRED, and /proc — fully supported inside WSL2. No macOS support in V1.
- Rust 1.75+ (built and tested on stable 1.93). Install via [rustup.rs](https://rustup.rs) if needed.
- SQLCipher development headers: `sudo apt install libsqlite3-dev` on Ubuntu/Debian.

---

## 1. Install Hermetic

```bash
curl -sSL https://hermeticsys.com/install.sh | sh
```

This builds and installs a single binary with subcommands. Verify the installation:

```bash
hermetic version
```

---

## 2. The Fast Path: Quickstart

If you have a `.env` file with API keys, the quickstart wizard handles everything in one command:

```bash
cd your-project/
hermetic init --quickstart
```

The wizard walks through five steps:

**Step 1 — Create your vault.** You'll be prompted for a passphrase (minimum 12 characters) with real-time strength feedback (Weak/Fair/Strong). Hermetic derives the encryption key via Argon2id (m=256MB, t=4, p=2) with a visual progress spinner — this takes about 18 seconds. That slowness is the security: it makes brute-force attacks computationally infeasible.

**Step 2 — Import your API keys.** The wizard detects `.env` files in the current directory, parses them, and matches keys against built-in service templates. For example, `ANTHROPIC_API_KEY` is auto-matched to the Anthropic template (auth scheme: x-api-key, allowed domain: api.anthropic.com). You confirm the import, and each key is encrypted individually with its own HKDF-derived key encryption key.

**Step 3 — Start the daemon.** The daemon applies OS hardening (memory locking, privilege restriction, ptrace protection), binds a Unix domain socket at `~/.hermetic/default/daemon.sock` with 0600 permissions, and enters the accept loop. Your passphrase is reused from Step 1 — no re-entry.

**Step 4 — Verify your credentials.** Each imported key is tested against its service's health endpoint. You'll see a pass/fail status for each one.

**Step 5 — Configure your AI tool.** Choose Claude Code, Cursor, Windsurf, or skip. The wizard generates and optionally installs the MCP server configuration for your chosen platform.

After quickstart completes, you're running. Skip to [Section 5: Use It](#5-use-it).

---

## 3. The Manual Path: Step by Step

If you prefer manual control, or don't have a `.env` file:

### 3.1 Create a vault

```bash
hermetic init
```

Choose a strong passphrase. The vault is created at `~/.hermetic/default/vault.db` with a unique 32-byte CSPRNG salt.

### 3.2 Store a secret

Using the interactive wizard (recommended — auto-detects service from key patterns):

```bash
hermetic add --wizard
```

The wizard prompts for a secret name, reads the secret value with no terminal echo, detects the service from known API key prefixes (Stripe `sk_live_`, OpenAI `sk-proj-`, GitHub `ghp_`, Anthropic `key-`, and others), and auto-configures the auth scheme and allowed domains. For OAuth2 providers, use `hermetic add --oauth` (Pro). For AWS credentials, use `hermetic add --aws` (Pro). Both provide guided step-by-step wizards with progress indicators.

Or specify everything explicitly via stdin:

```bash
echo -n "sk-proj-your-openai-key" | hermetic add openai-key \
  --allowed-domains api.openai.com \
  --auth-scheme bearer
```

Secrets are read from stdin — never in shell history, never in process arguments. The `--allowed-domains` flag restricts which hosts the secret can be sent to. This is vault-authoritative: the agent cannot override it.

### 3.3 Import from .env files

### 3.4 OAuth2 credentials (Pro)

For OAuth2-protected services (Google, Microsoft, GitHub, Slack, Salesforce, HubSpot, Spotify, Zoom):

```
hermetic add --oauth
```

The guided wizard walks through provider selection, client credential entry, browser-based authorization (with device flow for supported providers), and automatic verification. Tokens refresh transparently — the agent never knows it's OAuth.

### 3.5 AWS credentials (Pro)

For AWS services (S3, Bedrock, Lambda, DynamoDB, SQS, SES):

```
hermetic add --aws
```

Enter your access key ID, secret access key, and region. Hermetic signs every request with SigV4 automatically. The agent makes a normal API call — the HMAC-SHA256 signing is invisible.

If you have an existing `.env` file:

```bash
hermetic import --path .env
```

Each `KEY=value` pair is parsed, matched against service templates where possible, and stored. Use `--dry-run` to preview without storing. Maximum file size: 5 MiB.

### 3.4 Start the daemon

```bash
hermetic start
```

Enter your passphrase when prompted. The daemon starts in the background and applies all OS hardening before accepting any connections.

To preserve your session across reboots:

```bash
hermetic start --remember-session
```

This encrypts your passphrase (not the master key) with a session key derived from machine-specific identifiers. The session expires after 7 days and is destroyed on `hermetic stop` or `hermetic seal`. Note: ACPI S3 sleep preserves the running daemon — session persistence is for reboot and hibernate recovery only.

### 3.5 Verify the daemon is running

```bash
hermetic daemon-status
```

For detailed system diagnostics:

```bash
hermetic doctor
```

The doctor command runs 15 diagnostic checks: vault existence, daemon PID, socket health, binary integrity, template count, environment setup, SSRF transport, handle protocol, OS hardening, credential health, MCP bridge, and more. Each failure includes the command to fix it. It works when the daemon is down — that's when you need diagnostics most.

---

## 4. Connect an MCP Client

### Claude Code

```bash
hermetic mcp-config --target claude-code --install
```

This auto-registers Hermetic as an MCP server in Claude Code. If you prefer manual setup:

```bash
hermetic mcp-config --target claude-code
```

This prints the `claude mcp add` command to run yourself.

### Cursor

```bash
hermetic mcp-config --target cursor
```

Copy the output JSON into `.cursor/mcp.json` in your project root.

### Windsurf

```bash
hermetic mcp-config --target windsurf
```

Copy the output JSON into `.windsurf/mcp.json` in your project root.

### VS Code

```bash
hermetic mcp-config --target vscode
```

Copy the output JSON into `.vscode/mcp.json` in your project root.

### Claude Desktop

```bash
hermetic mcp-config --target claude-desktop
```

Copy the output JSON into your Claude Desktop config file (`~/.config/Claude/` on Linux).

### Any MCP-compatible client

The MCP bridge speaks JSON-RPC 2.0 over stdio:

```bash
hermetic mcp
```

Configure your client to spawn this command as a stdio MCP server.

---

## 5. Use It

Once the daemon is running and your AI tool is configured, the agent has access to five MCP tools:

### Make an authenticated request

The agent calls `hermetic_authenticated_request` with a secret name and URL. Hermetic issues a one-time handle, injects the credential into the HTTP request using the configured auth scheme, executes it with SSRF protection, and returns only the response. The agent never sees the key.

From the CLI, you can do the same:

```bash
hermetic request --secret openai-key \
  --url https://api.openai.com/v1/models \
  --method GET
```

### Run a command with a secret

The agent calls `hermetic_env_spawn` to run a command with a secret injected as an environment variable. The agent receives only the exit code.

From the CLI:

```bash
hermetic exec --secret deploy-token --env-var DEPLOY_TOKEN -- ./deploy.sh
```

Note: `exec` is ★★ TRANSIENT tier — the secret exists in the child process environment. The 26-binary blocklist (HC-8) prevents shells and interpreters from being spawned, but the child process can read its own environment.

### List your secrets

```bash
hermetic list
```

Shows names and metadata (domain binding, auth scheme, sensitivity level). Never shows values.

### Verify a credential

```bash
hermetic verify openai-key
```

Makes a probe request to the service's test endpoint using the full agent-isolated pipeline. Reports whether the credential is valid, rejected, or lacks permissions.

### Seal the vault (emergency)

```bash
hermetic seal
```

Immediately zeroizes all key material, invalidates all active handles, and destroys the session file. The vault is locked until the passphrase is re-entered. Use this if you suspect compromise.

---

## 6. What Happens Under the Hood

When your agent makes an authenticated request, the secret flows through four isolated zones: Agent (sees only the name) → MCP Bridge (routes the request) → Daemon (validates, decrypts, injects) → Transport (sends over HTTPS, then zeroizes). The secret exists in memory for approximately 1 millisecond. At no point does the agent observe the raw credential.

---

## 7. Environments

Hermetic uses named environments for complete vault isolation:

```bash
# Create a staging environment
hermetic --env staging init

# Store secrets in staging
hermetic --env staging add --wizard

# Start the staging daemon
hermetic --env staging start
```

Each environment has its own passphrase, encryption keys, secrets, audit log, and daemon socket. No cross-environment access. No silent fallback.

```
~/.hermetic/
├── default/         ← vault.db, vault.salt, daemon.sock, .install-secret
├── staging/         ← completely separate encryption
└── production/      ← completely separate encryption
```

Community Edition supports 1 named environment (`default`). [Commercial licenses](https://hermeticsys.com/license) unlock multiple environments.

---

## 8. Daily Workflow

After initial setup, your daily experience:

| Scenario | What Happens |
|----------|-------------|
| Open laptop (sleep resume) | Daemon is still running. Nothing to do. |
| Reboot (with `--remember-session`) | Daemon auto-resumes in ~3 seconds. Nothing to do. |
| Reboot (without session) | Run `hermetic start`, enter passphrase. One step. |
| Add a new API key | `hermetic add --wizard` (auto-detect), `--oauth` (Pro), or `--aws` (Pro). |
| Something breaks | `hermetic doctor`. Every error message includes the command to fix it. |
| New machine | `hermetic clone-env --export` on old machine, `hermetic clone-env --import` on new. Metadata transfers safely; you re-enter each secret value. |

---

## 9. Audit Trail

Every operation is logged in a tamper-evident HMAC-SHA256 audit chain:

```bash
# View recent audit entries
hermetic audit

# Verify chain integrity (detects tampering)
hermetic audit --verify

# Filter by secret
hermetic audit --secret openai-key
```

The audit log records handle issuance, handle redemption (success and failure), secret storage, vault seal/unseal, and session events. It records secret *names*, never values.

---

## 10. Troubleshooting

### Daemon won't start: "mlockall failed"

The daemon requires `RLIMIT_MEMLOCK` to be unlimited. Check with:

```bash
ulimit -l
```

If it shows a limit, add to `/etc/security/limits.conf`:

```
your-username    -    memlock    unlimited
```

Then log out and back in. In containers, add `--cap-add=IPC_LOCK` to your Docker run command.

### Daemon won't start: "socket already exists"

A previous daemon didn't shut down cleanly. The daemon checks for stale sockets, but if it fails:

```bash
hermetic stop
hermetic start
```

### Agent can't connect: "connection refused"

```bash
hermetic daemon-status
hermetic doctor
```

Check that the daemon is running and the socket exists at `~/.hermetic/default/daemon.sock` with 0600 permissions.

### MCP tool returns error: "domain not allowed"

The secret's `allowed_domains` doesn't include the URL's host. Domain binding is vault-authoritative — the agent cannot override it. Update the secret:

```bash
hermetic remove old-secret-name
echo -n "secret-value" | hermetic add new-name \
  --allowed-domains "api.example.com,api2.example.com" \
  --auth-scheme bearer
```

### Key derivation is slow (~18 seconds)

This is intentional. Argon2id with m=256MB, t=4, p=2 makes brute-force attacks on your passphrase computationally infeasible. It only runs once at vault creation and daemon unlock. Session persistence (`--remember-session`) means you only experience this delay after a reboot.

### Need more help?

```bash
hermetic doctor           # Comprehensive diagnostics
hermetic --help           # All subcommands
hermetic <command> --help # Help for a specific command
```

---

## What's Next

- **[Security Model](security-model.md)** — what Hermetic protects against and what it doesn't (including V1-LIM-1)
- **[MCP Integration Guide](mcp-integration.md)** — detailed setup for each supported AI platform
- **[Python SDK Guide](python-sdk.md)** — using Hermetic from Python with PyO3 escape-hatch blocking
- **[CLI Reference](cli-reference.md)** — all subcommands with full options and examples
- **[Architecture](architecture.md)** — the five interlocking security mechanisms in depth

</script>
<script type="text/plain" id="doc-mcp-integration">
# MCP Integration Guide

This guide covers connecting Hermetic to AI agents via the Model Context Protocol (MCP). By the end, your AI agent will make authenticated API requests through Hermetic without ever seeing your credentials.

**Prerequisites:** Hermetic installed, vault initialized with at least one secret, daemon running. If you haven't done this yet, see the [Getting Started guide](getting-started.md).

---

## How It Works

Hermetic ships an MCP server (`hermetic mcp`) that speaks JSON-RPC 2.0 over stdio. When an AI agent needs to make an authenticated API request, the flow is:

1. Agent calls `hermetic_authenticated_request` via MCP.
2. The MCP bridge connects to the Hermetic daemon via Unix domain socket.
3. The daemon issues a 256-bit single-use handle, UID-bound and domain-locked.
4. The bridge redeems the handle — the daemon decrypts the secret into `Zeroizing` memory.
5. The transport layer injects the credential, sends the HTTPS request, zeroizes the secret before the first `.await`.
6. The agent receives the HTTP response. It never observed the credential.

The MCP bridge is a thin routing layer. It holds no key material, stores no state, and its stdout is exclusively JSON-RPC wire protocol (MCP-5).

---

## Platform Setup

### Claude Code

**Automatic (recommended):**

```bash
hermetic mcp-config --target claude-code --install
```

This runs `claude mcp add` to register Hermetic directly in Claude Code's MCP server registry. Done — Claude Code will spawn `hermetic mcp` automatically when it needs credential access.

**Manual:**

```bash
hermetic mcp-config --target claude-code
```

This prints the `claude mcp add` command to stderr and the config JSON to stdout. Run the printed command yourself.

**Verify it's working:**

Open Claude Code and ask it to list your secrets:

```
List my Hermetic secrets.
```

The agent should call `hermetic_list_secrets` and return secret names and metadata — never values.

---

### Cursor

```bash
hermetic mcp-config --target cursor
```

This outputs a JSON block. Add it to `.cursor/mcp.json` in your project root:

```json
{
  "mcpServers": {
    "hermetic": {
      "command": "hermetic",
      "args": ["mcp", "--env", "default"]
    }
  }
}
```

If `.cursor/mcp.json` doesn't exist, create it with exactly this content. If it exists, merge the `hermetic` entry into the existing `mcpServers` object.

Restart Cursor after editing the config file.

---

### Windsurf

```bash
hermetic mcp-config --target windsurf
```

Add the output to `.windsurf/mcp.json` in your project root:

```json
{
  "mcpServers": {
    "hermetic": {
      "command": "hermetic",
      "args": ["mcp", "--env", "default"]
    }
  }
}
```

Restart Windsurf after editing.

---

### VS Code

```bash
hermetic mcp-config --target vscode
```

Add the output to `.vscode/mcp.json` in your project root:

```json
{
  "servers": {
    "hermetic": {
      "type": "stdio",
      "command": "hermetic",
      "args": ["mcp", "--env", "default"]
    }
  }
}
```

Note: VS Code uses `servers` with a `type` field, not `mcpServers`. The config format differs from Cursor and Windsurf.

---

### Claude Desktop

```bash
hermetic mcp-config --target claude-desktop
```

Add the output to your Claude Desktop config file:

- Linux: `~/.config/Claude/claude_desktop_config.json`
- macOS: `~/Library/Application Support/Claude/claude_desktop_config.json`

```json
{
  "mcpServers": {
    "hermetic": {
      "command": "hermetic",
      "args": ["mcp", "--env", "default"]
    }
  }
}
```

Restart Claude Desktop after editing.

---

### Any MCP-Compatible Client

The MCP bridge is a standard stdio server. Any client that supports the MCP protocol can use it:

```bash
hermetic mcp --env default
```

The bridge reads JSON-RPC 2.0 from stdin, writes JSON-RPC 2.0 to stdout, and sends all diagnostics to stderr. Configure your client to spawn this command as a stdio MCP server process.

---

## Using a Non-Default Environment

All examples above use `--env default`. To use a different named environment:

```json
{
  "mcpServers": {
    "hermetic-staging": {
      "command": "hermetic",
      "args": ["mcp", "--env", "staging"]
    }
  }
}
```

You can register multiple environments as separate MCP servers. Each connects to its own daemon instance with its own vault, secrets, and audit log.

Community Edition supports 1 environment (`default`). Multiple environments require a [commercial license](https://hermeticsys.com/license).

---

## MCP Tools Reference

The bridge exposes five tools. Every tool response obeys MCP-1: no secret value ever appears in any response, error message, notification, or log output.

### hermetic_authenticated_request

Make an HTTP request with injected credentials. This is the primary tool agents use.

**Parameters:**

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `secret_name` | string | Yes | Name of the secret to use for authentication |
| `url` | string | Yes | Target URL (must be HTTPS — HC-1) |
| `method` | string | No | HTTP method (default: GET) |
| `headers` | object | No | Additional headers (12 forbidden headers are stripped — HC-7) |
| `body` | string | No | Request body |

**What the agent receives:**

- HTTP status code
- Response headers
- Response body (size-capped to prevent memory exhaustion)

**What the agent does NOT receive:**

- The secret value
- Which auth scheme was used
- The raw Authorization/X-Api-Key header value

**Security enforcements:**

- Domain binding: the URL's host must match the secret's `allowed_domains` (MCP-7). The agent cannot override this.
- SSRF protection: 22 private/reserved IP ranges blocked, DNS resolved and validated before connection (HC-2).
- Redirect re-validation: max 3 hops, per-hop DNS re-resolve, credentials never resent (HC-6).
- Credential zeroization: secret is wiped from memory before the HTTP request enters the async runtime (HC-3).

---

### hermetic_suggest_add

Suggest adding a new secret (human confirms at CLI).

**Parameters:**

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `name` | string | Yes | Secret name (alphanumeric + underscore) |
| `value` | string | Yes | Secret value (encrypted immediately, zeroized from bridge memory) |
| `allowed_domains` | array | No | Domains this secret can be sent to |
| `auth_scheme` | string | No | Authentication scheme: `bearer`, `basic`, `x-api-key`, or `header:<name>` |

**Note:** This is the only MCP tool where a secret value transits the bridge process. The value exists in `Zeroizing<Vec<u8>>` memory for the duration of the store operation and is explicitly zeroized afterward.

---

### hermetic_list_secrets

List secret names and metadata.

**Returns:** Array of objects with `name`, `auth_scheme`, `allowed_domains`, and `sensitivity`. Never returns secret values.

---

### hermetic_env_spawn

Spawn a child process with a secret injected as an environment variable.

**Parameters:**

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `secret_name` | string | Yes | Secret to inject |
| `command` | string | Yes | Command to run (must not be a blocked binary) |
| `args` | array | No | Command arguments |
| `env_var` | string | No | Environment variable name (default: secret name uppercased) |

**Returns:** Exit code only. stdout and stderr from the child process are discarded by default (MCP-8).

**Security enforcements:**

- 26-binary blocklist (HC-8): shells (sh, bash, zsh, etc.), interpreters (python, node, ruby, etc.), and wrappers (env, xargs, nohup, etc.) are blocked.
- Environment is sanitized via `env_clear` (MCP env_spawn uses a clean environment, unlike CLI `hermetic exec` which inherits parent env per M-6).

**Trust tier:** ★★ TRANSIENT. The secret exists in the child process's environment for the duration of execution. This is a lower security tier than `authenticated_request` (★★★ BROKERED).

---

### hermetic_seal_vault

Emergency seal — immediately zeroizes all key material and invalidates all active handles.

**Parameters:** None.

**Returns:** Confirmation that the vault is sealed.

**Note:** This is destructive. The daemon remains running but the vault is locked. All subsequent handle operations return denial responses until the vault is unlocked again. This tool exists for "I think I'm compromised" scenarios.

**Tool annotations:** `destructiveHint: true`, `idempotentHint: true`.

---

## Tools That Don't Exist (By Design)

The following tools are intentionally absent from the MCP surface:

| Excluded Tool | Why |
|---------------|-----|
| `get_secret_value` | Would directly violate agent isolation. The entire point of Hermetic is that agents can't read secrets. |
| `export_secrets` | Bulk secret extraction would defeat the handle protocol. |
| `unlock_vault` | Agents must not control vault lifecycle. Unlocking requires a passphrase from /dev/tty. |
| `delete_secret` | Agents should not be able to destroy credentials. Deletion is a CLI-only operator action. |
| `update_policy` | Domain binding and auth scheme are vault-authoritative. Agents cannot modify security policy. |

If an AI framework requests any of these capabilities, that framework is asking to bypass the security model. Hermetic will never provide them.

---

## OpenClaw Integration

[OpenClaw](https://github.com/openclaw) supports external credential brokers via SecretRef and an exec provider interface. Hermetic generates the integration files:

```bash
hermetic onboard --target openclaw --output-dir .
```

This creates:

| File | Purpose |
|------|---------|
| `.agent/skills/hermetic/SKILL.md` | Agent integration documentation — available tools, usage examples |
| `openclaw.secrets.yaml` | Exec provider config pointing to `hermetic request` as the credential resolver |

The exec provider calls the `hermetic` binary directly via `execve` — not through a shell. The generated config includes a comment warning about this requirement. If the exec provider passes template variables through shell expansion, they become a command injection vector.

---

## Troubleshooting

### "Connection refused" or "daemon not running"

The MCP bridge connects to the daemon via Unix domain socket. The daemon must be running:

```bash
hermetic daemon-status
hermetic start
```

### "Domain not allowed"

The secret's `allowed_domains` doesn't include the target URL's host. Domain binding is vault-authoritative — the agent cannot override it. Check the secret's domains:

```bash
hermetic list
```

Update the secret if needed (remove and re-add with correct domains).

### Agent sees "tool not found"

The MCP client may not have loaded the Hermetic server configuration. Verify:

1. Config file is in the correct location for your platform.
2. The `command` path points to the `hermetic` binary (try the full path: `which hermetic`).
3. You restarted the client after editing the config.
4. The daemon is running (`hermetic daemon-status`).

### "Secret not found"

The secret name in the MCP call must exactly match the name stored in the vault. Names are case-sensitive. Check with `hermetic list`.

### Bridge produces no output

The MCP bridge sends all diagnostics to stderr, not stdout. If your client captures stderr, check there for startup messages and errors. Stdout is exclusively JSON-RPC wire protocol (MCP-5) — any non-JSON-RPC output on stdout would break the protocol.

### Community Edition banner in MCP responses

This is CL-3 — the Community Edition banner appears in the MCP `initialize` response. It does not affect functionality. It is removed with a [commercial license](https://hermeticsys.com/license).

---

## Security Model for MCP Surface

The MCP bridge operates at **PARTIAL TRUST** tier. It is the component most exposed to agent-controlled input. Key invariants:

- **MCP-1:** No secret value in any MCP response, tool result, error message, notification, or panic payload. No `Display` or `Debug` implementation on secret-carrying types produces secret bytes.
- **MCP-5:** Stdout purity. Zero `println!`/`print!` in hermetic-mcp production code. All diagnostics via `ui::` (stderr).
- **MCP-7:** Domain binding read from vault, not from caller. The agent cannot override `allowed_domains`.
- **MCP-4:** Malformed JSON-RPC produces an error response with no vault state change. Fail-closed.
- **MCP-6:** Tool annotations (`readOnlyHint`, `destructiveHint`, `idempotentHint`) are accurate on all 5 tools.

The audit log (CLI-only, `hermetic audit`) records all MCP operations including handle issuance, redemption, and denial. The audit log is deliberately not exposed as an MCP tool — this prevents agents from observing credential usage patterns.

---

## Next Steps

- **[Getting Started](getting-started.md)** — if you haven't set up Hermetic yet
- **[Python SDK Guide](python-sdk.md)** — using Hermetic from Python scripts and frameworks
- **[CLI Reference](cli-reference.md)** — all subcommands
- **[Security Model](security-model.md)** — full threat model and known limitations

<script type="text/plain" id="doc-python-sdk">
# Python SDK Guide

The Hermetic Python SDK (`hermetic-sdk`) is a native extension built with [PyO3](https://pyo3.rs) and [maturin](https://www.maturin.rs). It provides Python developers with agent-isolated credential brokering — secrets stay in Rust `Zeroizing` memory and never enter the Python runtime.

**Prerequisites:** Hermetic daemon running with at least one stored secret. Python 3.12+. See the [Getting Started guide](getting-started.md) if you need to set up Hermetic first.

---

## Installation

The SDK is built as a native Python extension via maturin:

```bash
# Create and activate a virtual environment
python3 -m venv .venv
source .venv/bin/activate

# Build and install from the Hermetic source tree
cd crates/hermetic-sdk
pip install maturin
maturin develop --release
```

After installation:

```python
from hermetic import HermeticClient, SecretHandle, HttpResponse
```

---

## Quick Example

```python
from hermetic import HermeticClient

# Connect to the daemon
client = HermeticClient()

# Get an opaque handle to a secret (secret bytes never enter Python)
handle = client.get_secret("openai-key")

# Make an authenticated request — credential injected on the Rust side
response = handle.authenticated_request(
    url="https://api.openai.com/v1/models",
    method="GET"
)

print(response.status)   # 200
print(response.body)     # JSON response body

# When you're done with the handle
handle.destroy()
```

At no point in this flow does the secret exist as a Python string, bytes object, or any Python-visible value.

---

## API Reference

### HermeticClient

Connects to the Hermetic daemon via Unix domain socket.

```python
client = HermeticClient()                              # Default environment
client = HermeticClient(env="staging")                 # Named environment
client = HermeticClient(socket="/path/to/daemon.sock") # Explicit socket
```

**Methods:**

| Method | Returns | Description |
|--------|---------|-------------|
| `get_secret(name)` | `SecretHandle` | Request a handle from the daemon. The daemon issues a 256-bit handle, the SDK redeems it, and the secret bytes are stored in Rust `Zeroizing<Vec<u8>>` memory. The Python `SecretHandle` object is opaque — it contains no secret data accessible to Python. |
| `list_secrets()` | `list[dict]` | List secret names and metadata (names, auth schemes, domains). Never returns values. |

---

### SecretHandle

An opaque reference to a secret. The secret bytes live in Rust memory behind a mutex-protected zeroizing buffer. The handle is reusable until explicitly destroyed — each call to `authenticated_request` clones the secret for the duration of the HTTP request.

**Methods:**

| Method | Returns | Description |
|--------|---------|-------------|
| `authenticated_request(url, method="GET", headers=None, body=None)` | `HttpResponse` | Make an authenticated HTTP request. The credential is injected by the Rust transport layer using the secret's configured auth scheme. Full SSRF protection, 12 forbidden headers stripped, credential zeroized before the HTTP request enters the async runtime. |
| `hmac_sign(data)` | `bytes` | Compute HMAC-SHA256 of `data` using the secret as key. The secret never leaves Rust. Uses ring for constant-time operations. |
| `hmac_verify(data, signature)` | `bool` | Verify an HMAC-SHA256 signature. Constant-time comparison via ring. |
| `destroy()` | `None` | Explicitly zeroize the secret and invalidate the handle. Safe to call multiple times. After destruction, all methods raise `HandleError`. |

**Properties:**

| Property | Type | Description |
|----------|------|-------------|
| `bool(handle)` | `bool` | `True` if the handle holds a live secret, `False` after `destroy()`. |

---

### HttpResponse

Returned by `authenticated_request`.

| Property | Type | Description |
|----------|------|-------------|
| `status` | `int` | HTTP status code |
| `headers` | `list[tuple[str, str]]` | Response headers as name-value pairs |
| `body` | `str` | Response body (UTF-8 decoded) |

---

### Exceptions

All exceptions inherit from `HermeticError`:

| Exception | Raised When |
|-----------|-------------|
| `HermeticError` | Base exception for all Hermetic SDK errors |
| `ConnectionError` | Daemon socket not found, connection refused, daemon not running |
| `HandleError` | Handle already destroyed, secret not found, daemon denied request |
| `TransportError` | SSRF blocked, HTTPS-only violation, timeout, DNS resolution failure |

```python
from hermetic import HermeticClient, HermeticError, ConnectionError, HandleError, TransportError

try:
    client = HermeticClient()
    handle = client.get_secret("my-key")
    response = handle.authenticated_request(url="https://api.example.com/v1/data")
except ConnectionError:
    print("Daemon not running. Run: hermetic start")
except HandleError as e:
    print(f"Handle error: {e}")
except TransportError as e:
    print(f"Transport error: {e}")  # SSRF blocked, HTTPS required, etc.
```

No exception message ever contains secret material (SDK-9).

---

## Escape-Hatch Blocking

The SDK blocks all standard Python introspection paths (`str`, `repr`, `bytes`, `pickle`, `copy`, `format`, `dir`, `getattr`, and more) at the Rust/PyO3 level. Every blocked operation returns opaque text or raises `TypeError`. The secret bytes never cross the FFI boundary into Python-visible memory.

If you discover an introspection path that leaks secret material, please report it via [SECURITY.md](../SECURITY.md).

---

## Usage Patterns

### Basic API call

```python
from hermetic import HermeticClient

client = HermeticClient()
handle = client.get_secret("anthropic-key")

response = handle.authenticated_request(
    url="https://api.anthropic.com/v1/messages",
    method="POST",
    headers={"Content-Type": "application/json"},
    body='{"model": "claude-sonnet-4-20250514", "max_tokens": 1024, "messages": [{"role": "user", "content": "Hello"}]}'
)

if response.status == 200:
    print(response.body)
else:
    print(f"API returned {response.status}")
```

### HMAC signing

```python
handle = client.get_secret("webhook-secret")

# Sign a payload
payload = b'{"event": "payment.completed", "amount": 4999}'
signature = handle.hmac_sign(payload)

# Verify a signature (constant-time comparison)
is_valid = handle.hmac_verify(payload, signature)
```

The secret never leaves Rust memory. The HMAC computation happens entirely on the Rust side using ring's constant-time implementation.

### Listing secrets

```python
client = HermeticClient()
secrets = client.list_secrets()

for s in secrets:
    print(f"{s['name']} → {s['auth_scheme']} → {s['allowed_domains']}")
```

Returns metadata only. Never returns secret values.

### Handle lifecycle

```python
handle = client.get_secret("my-key")

# Handle is reusable — make multiple requests
r1 = handle.authenticated_request(url="https://api.example.com/v1/users")
r2 = handle.authenticated_request(url="https://api.example.com/v1/orders")

# Explicit cleanup (zeroizes secret in Rust memory)
handle.destroy()

# After destroy, all operations raise HandleError
try:
    handle.authenticated_request(url="https://api.example.com/v1/data")
except HandleError:
    print("Handle is destroyed")

# Safe to call destroy again — no-op, no error
handle.destroy()
```

If you don't call `destroy()`, Rust's `Drop` implementation zeroizes the secret when the Python object is garbage collected. Explicit `destroy()` is preferred for deterministic cleanup.

### Multiple environments

```python
default_client = HermeticClient()
staging_client = HermeticClient(env="staging")

prod_handle = default_client.get_secret("stripe-key")
staging_handle = staging_client.get_secret("stripe-test-key")
```

Each client connects to its own daemon instance. Environments are fully isolated.

---

## Architecture

The SDK communicates only through the daemon's handle protocol. It cannot decrypt the vault or bypass daemon policy.

```
hermetic-sdk → hermetic-transport (HTTP, SSRF) + pyo3 (FFI)

The SDK cannot import hermetic-core, hermetic-daemon, or hermetic-mcp.
It can only communicate through the daemon's handle protocol.
```

This means the SDK cannot perform any vault operation that the daemon doesn't explicitly authorize through the handle protocol. Even if the SDK code were compromised, it could not extract secrets without the daemon's cooperation.

---

## Security Model

The Python SDK achieves ★★★ BROKERED security tier — the same as MCP `authenticated_request`. Secret bytes exist only in Rust `Zeroizing<Vec<u8>>` memory for approximately 1ms during HTTP request execution.

| Property | Status |
|----------|--------|
| Secret bytes cross FFI boundary | Never |
| HTTPS-only | Enforced |
| SSRF protection | 22 blocked ranges |
| Handle single-use | Atomic consumption |
| Caller verification | SO_PEERCRED |
| Secrets in errors | Never |

---

## Troubleshooting

### `ModuleNotFoundError: No module named 'hermetic'`

The SDK isn't installed in your active Python environment. Make sure you're in the correct virtualenv and run `maturin develop --release` from the `crates/hermetic-sdk` directory.

### `ConnectionError: daemon not running`

Start the daemon: `hermetic start`. The SDK connects via Unix domain socket at `~/.hermetic/<env>/daemon.sock`.

### `TransportError: SSRF blocked`

The target URL resolved to a private/reserved IP range. This is the SSRF protection working correctly. If you need to reach a local development API, the URL must resolve to a public IP.

### `HandleError: secret not found`

The secret name doesn't exist in the vault. Check with `hermetic list`. Names are case-sensitive.

### `TypeError` on any handle operation

You're hitting an escape-hatch block. This is intentional — the operation you're attempting would expose secret material to the Python runtime. Use `authenticated_request()` or `hmac_sign()` instead.

---

## Next Steps

- **[MCP Integration Guide](mcp-integration.md)** — connecting AI agents via MCP
- **[CLI Reference](cli-reference.md)** — all subcommands
- **[Security Model](security-model.md)** — full threat model and known limitations
- **[Getting Started](getting-started.md)** — initial Hermetic setup

# Hermetic V1 Security Model

**System:** Hermetic v1.0.0 — 46,607 LOC Rust · 935 tests · 1.72B fuzz, 10 crates
**Scope:** Local daemon deployment (single machine, Unix domain socket)
**Date:** March 2026

This document describes what Hermetic V1 protects against, what it does not protect against, and where the security boundaries are. It is written for security researchers, potential adopters, and anyone evaluating Hermetic for production use.

Hermetic uses the term _agent-isolated_ to describe its security property: secrets never enter the agent's address space or language runtime. This is enforced structurally through process boundaries, Rust's type system (`Zeroizing<Vec<u8>>` wrappers), and FFI escape-hatch blocking — not through behavioral promises that a sufficiently privileged agent could bypass.

---

## 1. Security Tiers

Not all execution paths offer the same isolation. Hermetic defines three tiers:

| Tier | Mechanism | Secret Exposure | Duration |
|------|-----------|----------------|----------|
| ★★★ BROKERED | `authenticated_request` via handle protocol (MCP or Python SDK) | Rust `Zeroizing` memory only, ~1ms. Never in Python or agent runtime. | Microseconds during HTTP request execution |
| ★★ TRANSIENT | `env_spawn` / `hermetic exec` with environment variable | Secret in child process environment. `/proc/<pid>/environ` readable by same-UID. | Child process lifetime |
| ★ DIRECT | CLI operator commands (`hermetic add`, `list`) | Requires passphrase from /dev/tty. Not accessible to non-interactive processes. | Operator session |

When evaluating Hermetic for your use case, identify which tier your workflow falls into.

---

## 2. What Hermetic Protects Against

### 2.1 Secret Exfiltration by AI Agent

**Attack:** A prompt-injected AI agent attempts to extract API keys, tokens, or passwords.

**Defense:** The agent communicates through the MCP JSON-RPC interface (stdio) or the Python SDK (PyO3 FFI). Five MCP tools are exposed — none return secret values. `hermetic_authenticated_request` returns only the HTTP response. `hermetic_env_spawn` returns only the exit code. `hermetic_list_secrets` returns names and metadata. `hermetic_seal_vault` zeroizes all key material.

The Python SDK enforces 10 escape-hatch blocks on `SecretHandle`: `__str__`, `__repr__`, `__bytes__`, `__format__`, `__hash__`, `__bool__`, `__getattr__`, `__reduce__`, `__reduce_ex__`, and `__sizeof__`. Every standard Python introspection path returns opaque text or raises `TypeError`.

**Enforced by:** MCP-1 (no secret in any MCP response), MCP-8 (env_spawn output suppression), SDK-1 through SDK-3 (escape-hatch blocking), DD-6 (SDK has no hermetic-core dependency — cannot decrypt vault).

### 2.2 Handle Replay (Double Spend)

**Attack:** An attacker captures a handle ID and attempts to redeem it multiple times.

**Defense:** Handles are consumed atomically. The daemon removes the handle from the store *before* performing any validation. If the handle existed, it is gone — regardless of whether subsequent checks (UID, TTL, domain) pass or fail. A second redemption attempt finds nothing and receives an indistinguishable denial (IC-1).

**Enforced by:** CC-1 (atomic single-use consumption). Verified by 1,350-round concurrent race test in the Baseline Audit campaign — zero double-redemptions.

### 2.3 Handle Theft (Cross-Process)

**Attack:** A different process intercepts or guesses a handle ID and attempts to redeem it.

**Defense:** Every handle is bound to the UID of the process that requested it. At redemption, the daemon verifies the caller's UID via `SO_PEERCRED` — a kernel-level mechanism that cannot be spoofed by userspace. Handle IDs are 256-bit CSPRNG random — brute force is computationally infeasible.

**Enforced by:** IC-3 (SO_PEERCRED at accept), handle UID binding at issuance and redemption.

### 2.4 Handle Rebinding After Secret Rotation (Ghost Handle Attack)

**Attack:** Between handle issuance and redemption, a secret is removed and a new secret with the same name is added. The handle now points to the wrong secret.

**Defense:** At issuance, the daemon stores a SHA-256 fingerprint of the secret's ciphertext. At redemption, the fingerprint is recomputed and compared. If the secret has been modified, the handle is denied.

**Enforced by:** HC-10 (handle-secret version binding). This was a real vulnerability discovered during adversarial testing — found and fixed within 1 hour.

### 2.5 SSRF (Server-Side Request Forgery)

**Attack:** An agent provides a URL resolving to an internal service (cloud metadata at `169.254.169.254`, localhost admin panels, private network services) to exfiltrate credentials.

**Defense:** Multi-layer validation:

1. **HTTPS-only (HC-1):** HTTP is rejected at three layers — daemon, transport, and MCP.
2. **IP literal rejection (HC-5):** URLs containing raw IP addresses are rejected. All requests go through DNS.
3. **DNS-resolve-then-validate (HC-2):** Every resolved IP is checked against 22 blocked ranges covering all private, loopback, link-local, reserved, and IPv6 transitional addresses.
4. **Connect-by-IP (HC-2):** The HTTP client connects to the validated IP directly, not the hostname. Eliminates DNS rebinding race conditions.
5. **Redirect re-validation (HC-6):** On every redirect, DNS is re-resolved and re-validated. Maximum 3 hops. Credentials are never resent on redirects.
6. **Domain binding (MCP-7):** The URL's host must match the secret's `allowed_domains`. Domain binding is vault-authoritative — the agent cannot override it.

### 2.6 Header Injection

**Attack:** An agent passes custom HTTP headers to hijack routing, override authentication, or manipulate proxy behavior.

**Defense:** 12 forbidden headers are unconditionally stripped from agent-supplied headers (including routing, proxy, and authentication headers). A default User-Agent is injected — the agent cannot override it.

**Enforced by:** HC-7 (request header sanitization), HC-12 (User-Agent injection). HC-7 was discovered by the external adversarial auditor.

### 2.7 Credential Leakage via URL Query Parameters

**Attack:** An agent or user stores a secret with query parameter authentication (`?api_key=SECRET`), causing the secret to appear in server logs, CDN caches, Referer headers, and proxy logs.

**Defense:** Query parameter authentication is prohibited. The auth scheme was removed entirely from the codebase.

**Enforced by:** HC-13 (query parameter auth prohibited). Only four auth schemes are supported: Bearer, Basic, X-Api-Key, and Custom Header. All inject credentials via HTTP headers, never URLs.

### 2.8 Shell Injection via env_spawn

**Attack:** An agent uses `hermetic_env_spawn` to run a shell interpreter that exfiltrates the secret from its environment.

**Defense:** Three-layer protection:

1. **Binary blocklist (HC-8):** 26 binaries are unconditionally blocked — shells, interpreters, and wrappers that could exfiltrate secrets from process environments. Both basename and full path are checked.
2. **Command whitelist:** If configured, only explicitly allowed commands can execute. Unknown commands are denied.
3. **Output suppression (MCP-8):** stdin, stdout, and stderr of the spawned process are connected to /dev/null. Only the exit code returns to the agent.

### 2.9 Credential Injection via URL

**Attack:** An agent provides a URL with embedded credentials (`https://user:password@api.example.com/`).

**Defense:** URLs containing embedded credentials (userinfo component) are rejected at handle issuance.

**Enforced by:** HC-5 (IP literal rejection extends to userinfo detection).

### 2.10 Memory Exposure

**Attack:** Secret material persists in process memory after use — swapped to disk, read via `/proc/PID/mem`, or survives in freed heap allocations.

**Defense:**

1. **Zeroizing memory:** All secret bytes stored in `Zeroizing<Vec<u8>>`. The drop guard overwrites the buffer with zeros on all exit paths, including panics. The compiler cannot optimize this away.
2. **Memory locking:** `mlockall(MCL_CURRENT | MCL_FUTURE)` at daemon startup prevents any page from being swapped to disk. Failure is fatal — the daemon refuses to start.
3. **Ptrace protection:** `prctl(PR_SET_DUMPABLE, 0)` prevents core dumps and restricts `/proc/<pid>/mem` access.
4. **Privilege restriction:** `prctl(PR_SET_NO_NEW_PRIVS, 1)` prevents privilege escalation via setuid binaries.
5. **Credential zeroization before await (HC-3):** Secret bytes are explicitly zeroized before the first `.await` point during HTTP execution. Verified for all 4 auth schemes.

All three OS hardening measures are FATAL — the daemon will not start if any fails. Init ordering is constitutionally mandated (SM-1): config → mlockall → privilege restriction → ptrace disable → panic hook → policy → syslog → socket.

### 2.11 Wire Protocol Attacks

**Attack:** A malicious client sends malformed, oversized, or deliberately slow data to the daemon socket.

**Defense:**

1. **Length-prefixed framing (IC-5):** Fixed-width length prefix. No delimiter scanning.
2. **Bounded reads (IC-4):** Payload size is bounded before parsing. Unbounded deserialization is prohibited — only bounded-buffer parsing is permitted.
3. **Frame assembly deadline (HC-9):** Wall-clock deadline enforced on frame assembly. Prevents Slowloris attacks. Empirically verified to terminate slow connections within the deadline.
4. **Connection limits (IC-2):** Per-UID and global connection limits are enforced, with idle and absolute lifetime timeouts.
5. **Indistinguishable denials (IC-1):** All denial responses are byte-identical regardless of reason. Attackers cannot distinguish failure modes. Verified by 10,000 differential probes in the Baseline Audit campaign.

### 2.12 Unauthorized Socket Access

**Attack:** A different user on the same machine connects to the daemon socket.

**Defense:**

1. **Filesystem permissions:** Socket created with mode 0600 (owner only). No `/tmp` paths. Parent directory must not be world-writable. Symlink check at creation (SM-3).
2. **SO_PEERCRED (IC-3):** Kernel-level UID verification at `accept()`. Non-matching UID = silent close (IC-1).
3. **Root denial:** UID 0 is denied by default unless explicitly configured via `--allowed-uids`.

---

## 3. Known Limitations (V1-LIM)

Honesty about limitations is a security property. These are acknowledged V1 boundaries, not bugs.

### V1-LIM-1: Same-UID Daemon Access (CRITICAL — scoping decision)

Any process running as the same Unix user can connect to the daemon socket and issue/redeem handles. `SO_PEERCRED` verifies UID only — it does not distinguish between the MCP bridge, the Python SDK, and a rogue process written by a prompt-injected coding agent.

**Impact:** If an AI agent has native code execution capability (shell access, code interpreter), a compromised agent can write a direct socket client and bypass the MCP/SDK isolation boundary.

**Why V1 doesn't address this:** V1 targets developer workstations where all processes share a UID. OS-level process isolation (cgroups, namespaces, seccomp sandboxing around the agent) is V2 scope.

**Mitigation:** Run untrusted agents under a separate UID. Use `--allowed-uids` to restrict daemon access.

> **This is the most important limitation to understand.** Hermetic V1 protects against agents extracting credentials through their declared interfaces. It does not protect against a malicious process running as the same Unix user.

### V1-LIM-2: Zero Production Deployments (HIGH)

Hermetic is pre-production software. No organization has deployed it in a production environment. The test suite (935 Community / 900 Pro tests, 1.72B fuzz executions, 7 red team campaigns) provides confidence but is not a substitute for real-world deployment experience.

### V1-LIM-3: No Independent Human Security Audit (HIGH)

Seven AI-driven red team campaigns are not a substitute for an independent human security audit by a named firm. Application to Trail of Bits / Cure53 OSS review programme is planned within 6 months of launch.

### V1-LIM-4: Linux / WSL2 Only (MEDIUM)

The architecture depends on `SO_PEERCRED`, `mlockall`, `/proc`, and Unix domain sockets — all Linux-specific. Windows users can run Hermetic natively inside WSL2 (Ubuntu 24.04 recommended). Full feature parity — SO_PEERCRED, mlockall, and /proc all work inside WSL2. No macOS support in V1.

**WSL2 limitations:** WSL2 shares the host's network stack. Localhost binding (`127.0.0.1`) is accessible from the Windows host. If your threat model includes Windows-side processes, bind to a Unix socket path instead of TCP. WSL2 filesystem performance for SQLCipher vault operations is native-speed on the ext4 mount (`/home/...`), but significantly slower on Windows-mounted paths (`/mnt/c/...`). Always keep the vault on the Linux filesystem.

### V1-LIM-5: Container Requires CAP_IPC_LOCK (MEDIUM)

`mlockall` requires `CAP_IPC_LOCK`, which most container runtimes drop by default. Docker: `--cap-add=IPC_LOCK`. Without it, the daemon refuses to start (fail-closed).

---

## 4. What Hermetic Does NOT Protect Against

### Compromised Host OS / Root Access

Root can read `/proc/PID/mem`, attach a debugger, or replace the binary. All secrets are accessible to root. No userspace application can defend against a compromised kernel. This is true of all software credential managers. Hardware Security Modules (HSMs) are the only defense — planned for V2 Enterprise.

### Network-Based Attacks

Not applicable in V1. The daemon listens on a Unix domain socket only — there is no network listener. Network attacks are structurally impossible against V1. V2 Gatekeeper will introduce network-accessible brokering with its own threat model.

### Hardware Memory Forensics

CPU cache, VM snapshots, and cold boot attacks can recover key material during AES-NI operations. Requires hardware enclaves (SGX/TrustZone) — planned for V3.

### Side-Channel Timing Attacks

IC-1 ensures all denial responses are byte-identical, eliminating content-based oracles. HMAC uses constant-time comparison via ring. Fine-grained timing analysis of Argon2id, AES-GCM, or handle lookup is not fully mitigated in V1.

### Denial of Service on Localhost

Connection limits (IC-2), rate limiting, frame deadline (HC-9), and connection lifetime caps (IC-6) provide partial defense. A determined local attacker can still saturate the connection pool. V1 assumes localhost is partially trusted.

### Weak Passphrase

12-character minimum is enforced. Argon2id with m=256MB makes brute force expensive (~3 seconds per attempt). Hermetic does not enforce complexity rules or dictionary checks. A weak passphrase with known patterns can be brute-forced offline if vault.db is stolen.

### Supply Chain Compromise

`cargo-deny` enforces license allowlists. `cargo audit` checks for known CVEs. `FROZEN_HASHES.sha256` tracks 116 source file hashes. V1 does not pin dependency hashes — full supply chain verification (reproducible builds, signed artifacts) is V2 scope.

---

## 5. Residual Risks

Known issues in V1 with documented mitigations:

| ID | Risk | Severity | Mitigation |
|----|------|----------|------------|
| RR-SESSION-1 | Session file and install secret co-located on disk. Local file read vector if accessed on same boot. | LOW | Session expires after 7 days. Boot-specific binding invalidates on reboot. Requires same-boot + file read access. |

| RR-SDK-2 | `Zeroizing` clone between handle redeem and transport. Panic between clone and zeroize leaves residual. | LOW | Panic hook kills process. mlockall prevents swap. Window is microseconds. |
| RR-003 | Audit key briefly duplicated in a non-zeroizing buffer during audit write. | LOW | Within single function scope. mlockall prevents swap. |
| RR-004 | Audit log uses wall-clock timestamps. No sequence counter. | LOW | Monotonic ordering not guaranteed under NTP adjustment. Integrity chain detects insertion. |
| RR-env | env_spawn child retains secret in `/proc/<pid>/environ` for process lifetime. | LOW | Child is short-lived. Same-UID only (V1-LIM-1 applies). |
| LEGACY | HKDF domain strings use legacy prefixes for vault backward compatibility. | INFO | Legacy strings preserved intentionally for vault format stability. |

# CLI Reference

Single binary, subcommands. All commands accept `--env <n>` to select a named environment (default: `default`).

```bash
hermetic [--env <n>] <command> [options]
```

Community Edition supports 1 environment (`default`). Multiple environments require a [commercial license](https://hermeticsys.com/license).

---

## Global Flags

| Flag | Description |
|------|-------------|
| `--env <n>` | Named environment (default: `default`). Each environment has its own vault, daemon, and audit log. |
| `--vault-path <path>` | Legacy: explicit vault path. Deprecated — use `--env` instead. |
| `--socket-path <path>` | Legacy: explicit socket path. Deprecated — use `--env` instead. |

---

## Setup & Vault

### init

Create a new vault.

```bash
hermetic init                    # Standard: create vault, prompt for passphrase
hermetic init --quickstart       # Guided: vault + .env import + daemon + MCP config
```

The `--quickstart` flag orchestrates the full first-time experience in one command: passphrase collection, vault creation (Argon2id ~18s), `.env` file detection with template matching, daemon startup, credential verification, and MCP tool configuration.

**Access pattern:** Direct (no daemon required).

---

### add

Store a secret in the vault.

```bash
hermetic add --wizard                                    # Interactive: auto-detect service
hermetic add --oauth                                     # OAuth2 guided wizard (Pro)
hermetic add --aws                                       # AWS SigV4 guided wizard (Pro)
echo -n "sk-proj-..." | hermetic add openai-key \        # Explicit: from stdin
  --allowed-domains api.openai.com \
  --auth-scheme bearer \
  --sensitivity high
```

| Flag | Description |
|------|-------------|
| `--wizard` | Interactive mode. Prompts for name, reads secret with no echo, detects service from key prefix patterns, auto-configures domains and auth scheme. |
| `--allowed-domains <domains>` | Comma-separated list of domains this secret can be sent to. Vault-authoritative — agents cannot override. |
| `--auth-scheme <scheme>` | One of: `bearer`, `basic`, `x-api-key`, `header:<n>`. |
| `--sensitivity <level>` | Metadata tag: `low`, `medium`, `high`. Does not affect encryption (all secrets use AES-256-GCM). |

Secret values are read from stdin. Never passed as command arguments (would appear in `ps`, `/proc/*/cmdline`, shell history).

**Access pattern:** Direct (vault unlocked via passphrase).

---

### remove

Delete a secret from the vault.

```bash
hermetic remove openai-key
```

Removes the secret and its metadata. Active handles for this secret will fail at redemption (HC-10 fingerprint mismatch).

**Access pattern:** Direct.

---

### list

Show secret metadata.

```bash
hermetic list                    # Full metadata: names, domains, auth schemes
hermetic list --count            # Number only (for shell prompt integration)
```

Never shows secret values.

**Access pattern:** Direct.

---

### import

Import secrets from a `.env` file.

```bash
hermetic import --path .env                              # Import all keys
hermetic import --path .env --dry-run                    # Preview without storing
hermetic import --path .env --allowed-domains api.example.com --auth-scheme bearer
```

| Flag | Description |
|------|-------------|
| `--path <file>` | Path to `.env` file. Maximum 5 MiB. |
| `--dry-run` | Show what would be imported without storing. |
| `--allowed-domains <domains>` | Default domains for keys without template matches. |
| `--auth-scheme <scheme>` | Default auth scheme for keys without template matches. |

Parses `KEY=value` lines. Strips `export` prefix, surrounding quotes, and trailing whitespace (CRLF-safe). Rejects keys containing characters outside `[A-Za-z0-9_]`. Rejects values containing null bytes. Warns and skips duplicates. Auto-matches keys against service templates (e.g., `ANTHROPIC_API_KEY` → Anthropic template).

**Access pattern:** Direct.

---

### templates

List or inspect built-in service templates.

```bash
hermetic templates                    # List all templates
hermetic templates anthropic          # Show details for one template
```

Each template provides: `display_name`, `allowed_domains`, `auth_scheme`, `default_secret_name`, `test_url`, `test_method`, and `hint` (URL where the user can find their API key). Templates cover three credential types: static API keys (26 Community), OAuth2 providers (8 Pro), and AWS services (7 Pro, Community templates). Templates are embedded at compile time via `include_str!` — no runtime file access.

**Available services:** Anthropic, OpenAI, Mistral, Cohere, Replicate, Stripe, Twilio, SendGrid, Mailgun, Slack, GitHub, GitLab, Datadog, PagerDuty, Cloudflare, Vercel, Supabase, Linear, Notion.

---

### status

Show vault and daemon information.

```bash
hermetic status                  # One-time status
hermetic status --watch          # Continuous refresh (5-second interval)
hermetic status --watch --interval 10
```

Displays: vault state, daemon PID, secret count, memory locked status, hardening state, last request summary, audit chain status.

---

## Daemon & Session

### start

Start the daemon in the background.

```bash
hermetic start                           # Standard: prompt for passphrase
hermetic start --remember-session        # Save encrypted session for reboot recovery
```

Applies OS hardening (mlockall, privilege restriction, ptrace protection) before accepting connections. Writes PID file to `~/.hermetic/<env>/daemon.pid`.

The `--remember-session` flag encrypts the passphrase (not the master key) with a session key derived from machine-binding context. Session expires after 7 days. Destroyed on `hermetic stop` or `hermetic seal`.

**Access pattern:** Interactive (passphrase from /dev/tty).

---

### stop

Stop the daemon and destroy the session file.

```bash
hermetic stop
```

Sends SIGTERM to the daemon process. Destroys the session file (zero-overwrite + delete). All active handles are invalidated.

---

### restart

Stop and start the daemon.

```bash
hermetic restart
hermetic restart --remember-session
```

Equivalent to `hermetic stop` followed by `hermetic start`.

---

### daemon

Run the daemon in the foreground (for debugging).

```bash
hermetic daemon
```

Same behavior as `start` but does not daemonize. Output goes to the terminal. Ctrl+C to stop. Useful for debugging socket and hardening issues.

**Access pattern:** Interactive (passphrase from /dev/tty).

---

### daemon-status

Check if the daemon is running.

```bash
hermetic daemon-status               # Human-readable output
hermetic daemon-status --quiet       # Exit code only (for scripts)
```

Exit codes: `0` = running, `1` = not running. The `--quiet` flag suppresses all output — designed for shell prompt integration and health checks.

---

### seal

Lock the vault and destroy all session material.

```bash
hermetic seal
```

Immediately zeroizes all key material in the daemon's memory, invalidates all active handles, and destroys the session file. The daemon remains running but all operations return denial responses until the vault is re-unlocked. Requires an interactive terminal (SM-5a: isatty gate).

Use this if you suspect compromise.

**Access pattern:** Interactive (requires terminal).

---

## Operations

### request

Make an authenticated HTTP request via the daemon.

```bash
hermetic request --secret openai-key \
  --url https://api.openai.com/v1/models \
  --method GET

hermetic request --secret stripe-key \
  --url https://api.stripe.com/v1/charges \
  --method POST \
  --body '{"amount": 2000, "currency": "usd"}' \
  --header "Content-Type: application/json"
```

| Flag | Description |
|------|-------------|
| `--secret <n>` | Secret to use for authentication. |
| `--url <url>` | Target URL (must be HTTPS — HC-1). |
| `--method <method>` | HTTP method (default: GET). |
| `--body <data>` | Request body. |
| `--header <key: value>` | Additional header (repeatable). 12 forbidden headers stripped — HC-7. |

Uses the full handle protocol: issue → redeem → inject → transport → zeroize. ★★★ BROKERED tier. SSRF protection and domain binding enforced.

**Access pattern:** Daemon (UDS handle protocol).

---

### verify

Test whether a stored credential is valid.

```bash
hermetic verify openai-key                    # Use template test_url
hermetic verify openai-key --url https://api.openai.com/v1/models
```

Makes a probe request to the service's test endpoint using the full handle protocol pipeline. Reports:

- `✓ HTTP 200` — credential is valid
- `✗ HTTP 401` — credential rejected
- `✗ HTTP 403` — credential lacks permissions

Uses the same transport pipeline as `request` (shared internal helper) — SSRF protection cannot be accidentally bypassed.

**Access pattern:** Daemon.

---

### exec

Run a command with a secret injected as an environment variable.

```bash
hermetic exec --secret deploy-token -- ./deploy.sh
hermetic exec --secret db-password --env-var DATABASE_URL -- ./migrate.sh
```

| Flag | Description |
|------|-------------|
| `--secret <n>` | Secret to inject. |
| `--env-var <n>` | Environment variable name (default: secret name uppercased). |
| `-- <command> [args...]` | Command and arguments to execute. |

**Security tier:** ★★ TRANSIENT. The secret exists in the child process environment for its lifetime. `/proc/<pid>/environ` is readable by same-UID processes (V1-LIM-1).

**Differences from MCP env_spawn:** `exec` inherits the parent environment (M-6 — parent shell is a trusted boundary). MCP `env_spawn` uses `env_clear` (untrusted agent environment). HC-8 binary blocklist applies to both.

**Access pattern:** Daemon.

---

## Integration & Tools

### mcp

Run the MCP JSON-RPC bridge over stdio.

```bash
hermetic mcp
```

Speaks JSON-RPC 2.0 on stdin/stdout. All diagnostics go to stderr (MCP-5: stdout purity). Exposes 5 tools: `hermetic_authenticated_request`, `hermetic_list_secrets`, `hermetic_env_spawn`, `hermetic_seal_vault`, `hermetic_suggest_add`.

Typically launched by an MCP client (Claude Code, Cursor, Windsurf), not run directly. See the [MCP Integration Guide](mcp-integration.md).

**Access pattern:** Daemon (UDS connection to running daemon).

---

Generate MCP server configuration for AI platforms.

hermetic mcp-config --target claude-code                 # Print command
hermetic mcp-config --target claude-code --install       # Auto-register
hermetic mcp-config --target cursor                      # JSON for .cursor/mcp.json
hermetic mcp-config --target windsurf                    # JSON for .windsurf/mcp.json
hermetic mcp-config --target vscode                      # JSON for .vscode/mcp.json
hermetic mcp-config --target claude-desktop              # JSON for Claude Desktop config

```

Runs 15 diagnostic checks: vault existence, daemon PID (via `/proc/<pid>/exe`), socket health, binary integrity, template count, environment directory, credential health, and more. Every failure includes the fix command. Works when the daemon is down — that's the primary scenario when diagnostics are needed.

Records handle issuance, redemption (success and failure), secret storage, vault seal/unseal, and session events. Records secret *names*, never values. The audit log is CLI-only — deliberately not exposed as an MCP tool (prevents agents from observing credential usage patterns).
