# Your AI Agent Should Never See Your API Keys

*Introducing Hermetic: an agent-isolated credential broker that keeps secrets out of the agent's context — permanently.*

---

Here's a pattern that has quietly become one of the most common security mistakes in AI development:

```python
client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
```

You've probably written a line like this. We all have. The problem isn't the code — it's what it means architecturally: your API key now lives in the agent's address space, its environment variables, its context, its logs. If your agent is Claude Code, Cursor, or any MCP-enabled system, that key is one prompt injection away from exfiltration.

This isn't a hypothetical. In March 2026, the LiteLLM supply chain attack (CVE-2026-33634) demonstrated exactly this: a compromised `.pth` file ran at Python interpreter startup and read environment variables. API keys gone. Silently. Before the first line of your code ran.

**Hermetic was built to make this class of attack architecturally impossible.**

---

## What Hermetic Does

Hermetic is a local daemon that sits between your AI agent and every API it calls. The agent never touches the credential. Ever.

Instead of injecting a key into the agent's environment, you give the agent a *handle* — an opaque 256-bit token that expires in 30 seconds and is valid only for one use. The agent sends this handle to Hermetic along with the URL and method it wants to call. Hermetic retrieves the real credential from its encrypted vault, injects it into the HTTP request headers, makes the call, and returns only the API response.

The agent gets the response. It never sees the key.

```
Agent (Claude Code, Cursor, Windsurf)
  │
  │  "I want to call api.stripe.com/v1/charges"
  │  "Here's my handle: 3f7a9b..."  ← opaque token, expires in 30s
  ▼
Hermetic Daemon  ← credential lives here, in mlocked memory
  │
  │  Authorization: Bearer sk-live-***  ← injected by daemon, never by agent
  ▼
api.stripe.com
  │
  ▼
Response → back to agent  ← API response only, no credential
```

This is **agent-isolated credential brokering**. The agent is isolated from the credential. Not limited. Not rate-limited. Not monitored. *Isolated.* The credential bytes never enter the agent's process.

---

## The Security Architecture

Five mechanisms enforce this property. None is sufficient alone — they compose:

**1. Brokered handle protocol**
Every credential operation goes through a 256-bit single-use token. The handle is bound to your Unix UID and expires in 30 seconds. If an agent tries to replay it, hold it, log it, or pass it to another process — it's useless. A handle is not a credential. It's a claim ticket.

**2. OS memory protection**
The daemon calls `mlockall(MCL_CURRENT | MCL_FUTURE)` at startup, which locks all memory pages and prevents the kernel from ever swapping them to disk. It also sets `PR_SET_DUMPABLE=0`, blocking core dumps and `/proc/self/mem` access. Both are FATAL if they fail — the daemon won't run degraded. If the OS can't protect secrets, Hermetic won't pretend it can.

**3. Type-system zeroization**
Every secret-carrying value uses the `zeroize` crate's `Zeroizing<Vec<u8>>`. When the wrapper drops, it zero-overwrites the memory before the allocator reclaims it. Secrets don't linger.

**4. SSRF-protected transport**
When an agent controls the URL it calls, it can point Hermetic at internal services, cloud metadata endpoints, or DNS rebinding targets. Hermetic's transport layer DNS-resolves the hostname, validates the resulting IP against 22 blocked ranges (RFC 1918, loopback, link-local, cloud metadata), pins the connection to the resolved IP, and only then injects the credential. Per-hop redirect re-validation is also enforced. Agents cannot use Hermetic as an SSRF proxy.

**5. FFI escape-hatch blocking**
The Python SDK wraps `SecretHandle` and blocks 14 introspection paths: `__str__`, `__repr__`, `__reduce__`, pickle serialization, `copy`, `deepcopy`, and others. There's no way to print a handle and get a key back. The secret never enters the Python runtime.

---

## Getting Started in 60 Seconds

**Install:**

```bash
curl -sSL https://hermeticsys.com/install.sh | bash
```

Or audit the crypto core (AGPL-3.0-or-later on GitHub):

```bash
cargo check  # audit the crypto — binary is pre-compiled
```

**Initialize with quickstart:**

```bash

```

This does everything in one pass: creates an encrypted vault, imports credentials from your `.env` file, starts the daemon, verifies the setup, and auto-configures MCP for every AI agent it detects (Claude Desktop, Cursor, Windsurf). Your passphrase is collected once and reused across the entire flow.

**That's it.** If you already have a `.env` file, Hermetic inherits it and you're protected immediately.

---

## MCP Integration

Hermetic speaks the Model Context Protocol natively. Once installed, it appears in your agent as five tools:

| Tool | What It Does |
|---|---|
| `hermetic_authenticated_request` | Make an API call — credential stays in the daemon |
| `hermetic_list_secrets` | List secret names (never values) |
| `hermetic_suggest_add` | Get the CLI command to add a new secret |

The MCP config, if you need to add it manually:

```json

  "mcpServers": {
    "hermetic": {
      "command": "/path/to/hermetic",
      "args": ["mcp", "--env", "default"]
    }

}
```

Place this in `~/.config/Claude/claude_desktop_config.json` for Claude Desktop, `~/.cursor/mcp.json` for Cursor, or `~/.windsurf/mcp.json` for Windsurf. For Claude Code: `hermetic connect claude-code` runs `claude mcp add` automatically.

Now your agent can call any API without touching the key:

```
Agent: "Make a POST request to api.stripe.com/v1/charges"
Hermetic: [injects Bearer token from vault, makes call, returns response]
Agent: [sees response, never sees token]
```

---

## What Community Gets (Free Binary, Open-Source Core)

The full security kernel. No feature gating on anything that matters:

- Encrypted vault (Argon2id + AES-256-GCM + SQLCipher)
- Complete handle protocol with all 7 constitutional invariants

935 tests. 1.72 billion fuzz executions across 13 targets. Zero crashes. Seven AI-conducted red team campaigns, 415+ attack vectors, zero cryptographic core breaches.

## Known Limitations — We Publish These Openly

**V1-LIM-1 (CRITICAL, SCOPING):** Any process running as the same Unix UID as the daemon has full socket access. The daemon uses `SO_PEERCRED` to verify UID but cannot distinguish between your CLI, your AI agent, and a rogue process sharing your user account. An attacker with same-UID code execution can use credentials through the daemon — they cannot steal the raw credential, but they can use it.

This is the primary V1 limitation. It's documented, it's pre-disclosed, and it's the V2 roadmap's top priority (per-PID Gatekeeper). Hermetic V1 is designed for developer workstations where the threat is the agent's declared interfaces, not same-UID malware. If you have same-UID malware, your `.env` file was already gone before Hermetic launched.

**V1-LIM-4:** Linux / WSL2 only. The architecture requires `SO_PEERCRED`, `mlockall`, and `/proc` — all available natively inside WSL2. Windows users: install WSL2 with Ubuntu 24.04. Performance parity confirmed. No macOS support in V1.

---

## The Verification Record

We don't ask you to trust our security claims. We publish the evidence:

Seven AI-conducted red team campaigns using Gemini 2.5 Pro and Claude Opus 4.6 in white-box adversarial mode — with full source access, not black-box testing. The campaigns found and fixed four real vulnerabilities (HC-7, HC-8, HC-10, HC-13). Every vulnerability got a constitutional amendment that governs the code path permanently. The cryptographic core was never breached across any campaign.

68+ constitutional amendments. Every security decision is traceable to an amendment ID. No informal rules.

3. Agent redeems handle with target URL — daemon injects credential, executes call, returns response
4. Agent sees the API response. Never the key.

**Quickstart:**

    hermetic init --quickstart

Vault creation → .env import → daemon start → MCP auto-config for all detected agents. One command.

**MCP tools (5, identical in Community and Pro):** authenticated_request, list_secrets, suggest_add, env_spawn, seal_vault.

**Security claims we can back:**

- 7 AI red team campaigns (Gemini 2.5 Pro + Claude Opus 4.6, white-box), 415+ vectors, 0 crypto core breaches
- 1.72B fuzz executions, 13 targets, 0 crashes
- 68 constitutional amendments — every security decision traceable to an amendment ID
- Real vulns found and fixed: HC-7 (header injection), HC-8 (shell bypass via env_spawn), HC-9 (Slowloris on UDS), HC-10 (ghost handle after rotation)

**Known limitations we publish openly:**

V1-LIM-1 (CRITICAL): Same-UID processes have full socket access. SO_PEERCRED verifies UID but not which binary. Same-UID malware can use credentials through the daemon — it cannot steal the raw key, but can make API calls. This is the primary V1 limitation and top of the V2 roadmap. SECURITY.md has the full table.

V1-LIM-4: Linux / WSL2 only (SO_PEERCRED, mlockall, /proc). Windows users run natively via WSL2.

**Community (free binary, open-source core):** Full security kernel, 30 commands, 26 templates, 5 MCP tools, Python SDK. 10 secrets, 1 environment.

**Pro (coming soon, $10/mo):** OAuth2 transparent refresh (8 providers), AWS SigV4 (7 services, live-tested), TUI + web dashboards, token monitoring, 115 templates.

46,607 LOC Rust, 10 crates, 935 tests.

GitHub: https://github.com/hermetic-sys/hermetic

<script type="text/plain" id="drop-checklist">
# The Security Checklist for AI Agent Credentials

*Eight patterns. Most teams get two right.*

---

AI agents are becoming the primary consumer of your API keys. They call Stripe, OpenAI, GitHub, AWS, Slack — everything your backend calls, plus a few things only they call. And yet the credential security practices that most teams apply to their agents are roughly equivalent to what they'd do for a shell script from 2014.

This is the checklist we wish existed when we were building Hermetic. Run through it for your own AI agent stack.

---

## Pattern 1: The credential is not the secret — exposure is

The instinct is to protect the *value* of the credential. The actual risk is *surface area of exposure* — how many places the raw bytes exist.

Every location where a key lives is an attack surface: environment variables (readable by child processes and `/proc/PID/environ`), context windows (logged, cached, visible to LLM providers), files (`.env` checked into git), memory (swappable, dumpable, readable via ptrace). Multiply by the number of agent processes, the number of sessions, and the number of places the agent logs its reasoning.

**Checklist:**
- [ ] Can you enumerate every place your API key currently exists at rest?
- [ ] Does your agent's context window ever contain a credential value? (Check your traces)
- [ ] Are your `.env` files in `.gitignore` — and has that always been the case, including during initial setup?
- [ ] Do agent session logs go to a system that could store credential values?

---

## Pattern 2: Environment variables are not secrets management

`os.environ["STRIPE_KEY"]` is a process-level variable. It's inherited by child processes, visible in `/proc/PID/environ` to same-UID processes, included in some crash dumps, and often propagated to subprocesses you didn't intend to reach. Worse, AI agents frequently read environment variables as part of their contextual understanding of the system — and pass that context to the model.

Environment variables are fine for configuration. They are not designed for secrets.

**Checklist:**
- [ ] Are secrets stored in a system with encryption at rest?
- [ ] Is the encryption key derived from something the agent cannot read (passphrase, HSM, etc.)?
- [ ] Does your agent framework clear its environment before spawning subprocesses?
- [ ] Have you audited what your AI agent actually *reads* from the environment?

---

## Pattern 3: The agent should be isolated from the credential, not just rate-limited

Most teams think about access control: "the agent can only call these endpoints." That's a useful layer but it misses the structural problem. If the agent *has* the key, it can potentially extract it — through prompt injection, through a compromised dependency, through a crafted response from an upstream API.

The correct pattern is architectural isolation: the agent never receives the raw credential. It receives a handle — an opaque token that the credential broker exchanges for an API call on the agent's behalf. The agent cannot extract the key from the handle because the handle is not derived from the key.

**Checklist:**
- [ ] Does your agent receive raw credential values, or only derived handles/tokens?
- [ ] If your agent's context window were logged and leaked, would any credential be exposed?
- [ ] Can a prompt injection in an API response cause your agent to exfiltrate a key?
- [ ] Does your setup survive the scenario: "the LLM provider sees everything in the context"?

---

## Pattern 4: Prompt injection is a credential exfiltration vector

Prompt injection is well-understood as a way to change agent behavior. It is less understood as a credential theft mechanism.

If your agent has `OPENAI_API_KEY` in its context and an attacker controls a webpage it reads, a PDF it processes, or a repository it clones, that attacker can instruct the agent to repeat its environment variables or make a call to an attacker-controlled endpoint. The agent is following instructions — it doesn't know the key is sensitive.

**Checklist:**
- [ ] Does your agent process untrusted content (web pages, user files, external repositories)?
- [ ] If it does, is it possible for that content to instruct the agent to exfiltrate environment variables?
- [ ] Are API calls from your agent SSRF-protected? Can the agent be instructed to call `169.254.169.254`?
- [ ] Does your agent framework validate the destination of all outbound requests?

---

## Pattern 5: Memory is not ephemeral

Developers assume that credentials in memory are transient and safe. They're often wrong.

Memory can be swapped to disk if the OS comes under pressure — and disk is persistent. Memory can be dumped to `/proc/PID/mem` by any same-UID process. Memory can appear in core dumps if the process crashes. Memory can be read by a debugger attached to the process.

Mitigations exist at the OS level: `mlockall` prevents swapping, `PR_SET_DUMPABLE=0` blocks core dumps and `/proc` access. But these require explicit setup — they're not defaults.

**Checklist:**
- [ ] Does your credential broker call `mlockall` to prevent swap?
- [ ] Does it set `PR_SET_DUMPABLE=0` to block core dumps?
- [ ] Are these settings FATAL if they fail — does the system refuse to run without them?
- [ ] Does your credential type zero-overwrite memory on deallocation?

---

## Pattern 6: Supply chain attacks target credential access, not credential theft

The LiteLLM supply chain attack (CVE-2026-33634) is instructive. A malicious package read `os.environ` at Python interpreter startup — before the application's main() ran, before any credential rotation, before any audit logging. Keys gone.

The naive mitigation is "don't have malicious packages." The structural mitigation is "don't put credentials in `os.environ` where any package can read them." If credentials are only accessible through a broker that requires an explicit request (not just an environment read), supply chain attacks targeting environment variables don't work.

**Checklist:**
- [ ] If a malicious `.pth` file ran before your agent code, what would it find in the environment?
- [ ] Does your setup assume that the Python interpreter (or Node runtime, or shell) is trusted?
- [ ] Are you running `pip audit` or equivalent on agent dependencies?
- [ ] Do your agent dependencies have access to more than they need?

---

## Pattern 7: Audit logging must be independent of the agent

If your audit trail of credential usage is written by the same process that uses the credentials, a compromised agent can falsify, suppress, or delete that log. The audit function must be in a component the agent cannot write to.

Similarly, if the agent controls the log destination, it can redirect logs to `/dev/null` or to an attacker-controlled endpoint.

**Checklist:**
- [ ] Is credential usage audit logging performed by the credential broker, not the agent?
- [ ] Can the agent suppress or modify audit log entries?
- [ ] Are audit logs append-only with tamper detection (e.g., HMAC chain)?
- [ ] Does the audit log record the process that made each credential request?

---

## Pattern 8: Known limitations are not weaknesses — undisclosed limitations are

Every credential security system has limitations. The question is whether you know what they are and whether your users know what they are.

Systems that hide limitations put users at risk because users can't make informed decisions about where to deploy them. Systems that disclose limitations give users the information they need to deploy appropriately and mitigate accordingly.

Before deploying a credential broker (ours or anyone else's), get explicit answers to:
- What threat model does it assume?
- What threats does it *not* protect against?
- What happens under the same-UID threat model?
- What happens if the host OS is compromised?
- What happens on container deployments?

**Checklist:**
- [ ] Have you read the security model documentation for every credential-handling component you use?
- [ ] Do you know the known limitations of your agent credential stack?
- [ ] Are those limitations acceptable for your deployment context?
- [ ] If you're building for others, do your users know the limitations?

---

## Where Hermetic Fits

Hermetic is designed to check off Patterns 1–7 structurally — not through policy or convention, but through architecture.

The agent never holds a credential (Pattern 3). The credential never enters the context window (Patterns 1, 4). Memory is locked and non-dumpable (Pattern 5). The broker verifies the destination before any credential injection — 22 blocked SSRF ranges, DNS pinning, per-hop redirect re-validation (Pattern 4). Audit logging is in the daemon, not the agent (Pattern 7). And on Pattern 8: our known limitations are in [SECURITY.md](https://github.com/hermetic-sys/hermetic/blob/main/SECURITY.md), including the primary V1 limitation (V1-LIM-1: same-UID process access).

Pattern 2 (environment variables) is where most teams start. Hermetic isn't a drop-in replacement for `.env` — it's a structural change in how credentials are accessed. The quickstart is designed to make that transition as fast as possible:

```bash
hermetic init --quickstart  # imports your .env, configures your agents, ~60 seconds
```

The rest is architecture.

---

function copyToClipboard(text,btn){
  var fallback=function(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(fallback)}else{fallback()}
  if(btn){var orig=btn.textContent;btn.textContent='✓ Copied';setTimeout(function(){btn.textContent=orig},1500)}

function ZeroizeString({active}){
  const secret='sk-proj-a8Kx9mQ2nR';
  const[display,setDisplay]=useState(secret);
  const[done,setDone]=useState(false);
  useEffect(function(){
    if(!active){setDisplay(secret);setDone(false);return}
    var chars=secret.split('');var idx=0;
    var iv=setInterval(function(){
      if(idx>=chars.length){clearInterval(iv);setDone(true);return}
      chars[idx]='0';setDisplay(chars.join(''));idx++;
    },80);
    return function(){clearInterval(iv)};
  },[active]);
  return React.createElement('span',{style:{fontFamily:'var(--mn)',fontSize:12,letterSpacing:'1px',color:done?'var(--green)':active?'var(--red)':'var(--t3)',transition:'all 0.2s'}},done?'0'.repeat(secret.length):display);
}
