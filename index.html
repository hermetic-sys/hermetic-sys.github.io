.bloom-ring { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0.5; filter: blur(80px); }
@keyframes pulseGlow { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
.shimmer-text { background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent)); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 4s linear infinite; }
.card { position: relative; overflow: hidden; }
.card::before { content:''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(79,209,197,0.15), transparent); opacity: 0; transition: opacity 0.4s; }
.card:hover::before { opacity: 1; }

.theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--t2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; flex-shrink: 0; }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--pill-bg); }
::selection { background: var(--selection); }
#root { position: relative; }
a { color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
a:hover { opacity: 0.8; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 3px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 28px; }

/* ═══ NAV ═══ */
.nav { position: sticky; top: 0; z-index: 100; background: var(--nav-glass); backdrop-filter: blur(24px) saturate(1.4); border-bottom: 1px solid var(--border); transition: background 0.3s; }
.nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.nav-logo-text { font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
.nav-links { display: flex; gap: 4px; align-items: center; }
.nav-link { padding: 8px 16px; font-size: 14px; font-weight: 500; color: var(--t2); border-radius: 8px; cursor: pointer; transition: all 0.2s; border: none; background: none; font-family: var(--hd); }
.nav-link:hover { color: var(--t1); background: var(--card-hover); }
.nav-link.active { color: var(--t1); background: rgba(79,209,197,0.1); }
.nav-cta { padding: 8px 20px; font-size: 13px; font-weight: 600; color: #000; background: var(--accent); border: none; border-radius: 100px; cursor: pointer; font-family: var(--hd); transition: all 0.25s; box-shadow: 0 0 20px rgba(79,209,197,0.2); }
.nav-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79,209,197,0.35), 0 0 40px rgba(79,209,197,0.15); }

/* ═══ BURGER ═══ */
.burger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 40px; height: 40px; background: none; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; padding: 9px; }
.burger span { display: block; height: 2px; background: var(--t2); border-radius: 2px; transition: all 0.3s; }
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; backdrop-filter: blur(4px); }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; transform: translateX(105%); width: min(300px,85vw); height: 100%; background: var(--surface); border-left: 1px solid var(--border); z-index: 201; transition: transform 0.3s; overflow-y: auto; padding-bottom: 40px; }
.drawer.open { transform: translateX(0); }
.drawer-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.drawer-close { width: 32px; height: 32px; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--t2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.drawer-item { display: block; width: 100%; padding: 16px 20px; background: none; border: none; border-bottom: 1px solid rgba(30,32,48,0.5); color: var(--t2); font-size: 15px; font-family: var(--hd); cursor: pointer; text-align: left; transition: all 0.15s; font-weight: 500; }
.drawer-item:hover, .drawer-item.active { color: var(--t1); background: rgba(79,209,197,0.08); }

/* ═══ SECTIONS ═══ */
.sec { padding: 100px 0; }
.sec-label { font-family: var(--mn); font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.sec-title { font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 16px; text-align: center; }
.sec-sub { font-size: 17px; color: var(--t2); line-height: 1.7; max-width: 640px; margin-left: auto; margin-right: auto; text-align: center; }
.sec-sub.center { margin: 0 auto; text-align: center; }
.sec-hd { margin-bottom: 56px; text-align: center; }
.sec-hd.center { text-align: center; }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border-h), transparent); margin: 0; }

/* ═══ CARDS ═══ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
.card:hover { border-color: var(--border-h); transform: translateY(-3px); box-shadow: 0 16px 48px rgba(0,0,0,0.35), 0 0 30px rgba(79,209,197,0.06); }
.card-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; }


/* ═══ WORD CAROUSEL ═══ */
.word-carousel { position: relative; display: inline-block; vertical-align: bottom; overflow: hidden; height: 1.15em; text-align: center; transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.word-sizer { display: inline-block; visibility: hidden; height: 0; overflow: hidden; pointer-events: none; white-space: nowrap; font-weight: inherit; letter-spacing: inherit; font-size: inherit; line-height: inherit; padding: 0 4px; }
.word-item { position: absolute; left: 0; top: 0; width: 100%; display: block; white-space: nowrap; opacity: 0; transform: translateY(110%); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform, opacity; }
.word-item.word-active { opacity: 1; transform: translateY(0); }
.word-item.word-exit { opacity: 0; transform: translateY(-110%); }

/* ═══ HERO ═══ */
.hero { padding: 80px 0 60px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -30%; left: 50%; transform: translateX(-50%); width: 900px; height: 900px; background: radial-gradient(circle, rgba(79,209,197,0.09) 0%, transparent 60%); pointer-events: none; animation: pulseGlow 6s ease-in-out infinite; }
.hero::after { content: ''; position: absolute; top: -10%; right: 10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,179,237,0.06) 0%, transparent 60%); pointer-events: none; animation: pulseGlow 8s ease-in-out infinite 2s; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 100px; background: rgba(79,209,197,0.08); border: 1px solid rgba(79,209,197,0.15); font-size: 13px; font-weight: 500; color: var(--accent); margin-bottom: 28px; font-family: var(--mn); }
.hero h1 { font-size: clamp(32px, 5.5vw, 60px); font-weight: 800; line-height: 1.1; letter-spacing: -2px; margin-bottom: 20px; max-width: 720px; margin-left: auto; margin-right: auto; text-align: center; }
.hero-sub { font-size: 18px; color: var(--t2); line-height: 1.7; max-width: 540px; margin-bottom: 36px; margin-left: auto; margin-right: auto; text-align: center; }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 56px; justify-content: center; }
.btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-size: 15px; font-weight: 700; border: none; border-radius: 100px; cursor: pointer; font-family: var(--hd); color: #000; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 4px 24px rgba(79,209,197,0.25), 0 0 60px rgba(79,209,197,0.1); transition: all 0.3s; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(79,209,197,0.4), 0 0 80px rgba(79,209,197,0.15); }
.btn-secondary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-size: 15px; font-weight: 600; border: 1px solid var(--border); border-radius: 100px; cursor: pointer; font-family: var(--hd); color: var(--t2); background: transparent; transition: all 0.3s; }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,209,197,0.04); }

/* ═══ DEMO ═══ */
.demo { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; max-width: 680px; margin: 0 auto; }
.demo-tabs { display: flex; border-bottom: 1px solid var(--border); }
.demo-tab { flex: 1; padding: 14px 16px; font-size: 13px; font-weight: 600; color: var(--t3); cursor: pointer; border: none; background: none; font-family: var(--hd); transition: all 0.2s; text-align: center; position: relative; }
.demo-tab.active { color: var(--t1); background: rgba(79,209,197,0.05); }
.demo-tab.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; background: var(--accent); border-radius: 2px; }
.demo-body { padding: 24px; min-height: 240px; }
.chat-msg { display: flex; gap: 12px; margin-bottom: 16px; }
.chat-avatar { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.chat-bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.6; max-width: 420px; }
.chat-user .chat-avatar { background: rgba(99,179,237,0.15); }
.chat-user .chat-bubble { background: rgba(99,179,237,0.08); border: 1px solid rgba(99,179,237,0.12); color: var(--t1); }
.chat-ai .chat-avatar { background: rgba(79,209,197,0.15); }
.chat-ai .chat-bubble { background: rgba(79,209,197,0.06); border: 1px solid rgba(79,209,197,0.1); color: var(--t2); }

/* ═══ FEATURE GRID ═══ */
.feat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.feat-card { padding: 24px; transition: border-color 0.3s; }
.feat-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.feat-card p { font-size: 13px; color: var(--t3); line-height: 1.5; }


/* ═══ STATS ═══ */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 48px; }
.stat { text-align: center; padding: 24px 16px; }
.stat-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; text-shadow: 0 0 40px currentColor, 0 0 80px currentColor; }
.stat-label { font-family: var(--mn); font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: 1px; }

/* ═══ CODE ═══ */
.code-block { background: var(--code-bg, #0a0b10); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
.code-block:hover { border-color: var(--border-h); box-shadow: 0 0 30px rgba(79,209,197,0.04); }
.code-header { background: var(--card-bg); padding: 10px 16px; font-family: var(--mn); font-size: 12px; color: var(--t3); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.code-body { padding: 16px 20px; font-family: var(--mn); font-size: 13px; line-height: 1.8; overflow-x: auto; white-space: pre; color: var(--code-text, #c8ccd8); }
.code-body .k { color: var(--code-keyword); }
.code-body .s { color: var(--code-string); }
.code-body .c { color: var(--code-comment); font-style: italic; }
.code-body .n { color: var(--code-name); }
.code-body .v { color: var(--code-value); }
.copy-btn { padding: 4px 10px; font-size: 11px; font-family: var(--mn); font-weight: 600; border: 1px solid var(--border); color: var(--t3); border-radius: 6px; cursor: pointer; background: transparent; transition: all 0.2s; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ═══ PIPELINE ═══ */
.pipe-steps { display: flex; flex-direction: column; gap: 0; }
.pipe-step { display: grid; grid-template-columns: 56px 1fr; gap: 0; }
.pipe-marker { display: flex; flex-direction: column; align-items: center; }
.pipe-num { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mn); font-weight: 700; font-size: 14px; border: 2px solid; flex-shrink: 0; z-index: 2; transition: all 0.3s; }
.pipe-step:hover .pipe-num { transform: scale(1.12); }
.pipe-line { width: 2px; flex: 1; min-height: 20px; z-index: 1; }
.pipe-body { padding: 0 0 36px 16px; }
.pipe-label { font-family: var(--mn); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.pipe-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.pipe-desc { font-size: 14px; color: var(--t2); line-height: 1.7; max-width: 580px; }

/* ═══ TAGS ═══ */
.tag { font-family: var(--mn); font-size: 12px; padding: 4px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }

/* ═══ COMMUNITY ═══ */
.community-links { display: flex; gap: 16px; flex-wrap: wrap; }
.community-link { display: flex; align-items: center; gap: 14px; padding: 20px 28px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; text-decoration: none; color: var(--t1); min-width: 200px; }
.community-link:hover { border-color: var(--border-h); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.community-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--card-hover); }
.community-name { font-size: 16px; font-weight: 700; }
.community-meta { font-size: 13px; color: var(--t3); font-family: var(--mn); }

/* ═══ ECOSYSTEM ═══ */
.eco-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.eco-chip { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--t2); transition: all 0.25s; cursor: default; }
.eco-chip:hover { border-color: var(--border-h); color: var(--t1); background: var(--surface2); }
.eco-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ═══ PRICING ═══ */
.price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 960px; margin: 0 auto; }
.price-card { padding: 28px 32px; position: relative; overflow: hidden; text-align: left; }
.price-card.featured { border-color: var(--pill-border); background: var(--pill-bg); }
.price-card.featured::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.price-name { font-size: 14px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mn); margin-bottom: 8px; }
.price-amount { font-size: 40px; font-weight: 800; letter-spacing: -2px; margin-bottom: 4px; }
.price-period { font-size: 14px; color: var(--t3); margin-bottom: 24px; }
.price-features { list-style: none; margin-bottom: 28px; text-align: left; }
.price-features li { padding: 8px 0; font-size: 14px; color: var(--t2); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--card-border); }
.price-features li::before { content: '✓'; color: var(--accent); font-weight: 700; font-size: 13px; }
.price-btn { display: block; width: 100%; padding: 14px; text-align: center; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--hd); border: none; transition: all 0.3s; }

/* ═══ FOOTER ═══ */
.footer { border-top: 1px solid var(--border); padding: 48px 0; }
.footer-inner { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; text-align: center; flex-direction: column; }
.footer-copy { font-size: 13px; color: var(--t3); font-family: var(--mn); }
.footer-links { display: flex; gap: 24px; }
.footer-link { font-size: 13px; color: var(--t3); cursor: pointer; transition: color 0.2s; background: none; border: none; font-family: var(--hd); }
.footer-link:hover { color: var(--accent); }

/* ═══ SCROLL REVEAL ═══ */
.sr { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
.sr.vis { opacity: 1; transform: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.sr-d1 { transition-delay: 0.1s; }
.sr-d2 { transition-delay: 0.2s; }
.sr-d3 { transition-delay: 0.3s; }

/* ═══ DIVIDER ═══ */
.divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(79,209,197,0.12), transparent); margin: 0; }

/* ═══ RESEARCH / WHITEPAPER ═══ */
.wp-article { max-width: 760px; margin: 0 auto; }
.wp-h1 { font-size: 22px; font-weight: 800; color: var(--t1); margin: 48px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); letter-spacing: -0.3px; }
.wp-h2 { font-size: 17px; font-weight: 700; color: var(--accent); margin: 36px 0 12px; }
.wp-p { font-size: 15px; line-height: 1.75; color: var(--t2); margin-bottom: 16px; }
.wp-p strong { color: var(--t1); font-weight: 600; }
.wp-callout { padding: 16px 20px; border-radius: 10px; margin: 24px 0; font-size: 14px; line-height: 1.7; border-left: 3px solid; }
.wp-callout.warn { background: rgba(246,201,69,0.06); border-color: var(--gold); color: var(--gold); }
.wp-callout.ok { background: rgba(72,187,120,0.06); border-color: var(--green); color: var(--green); }
.wp-callout.info { background: rgba(159,122,234,0.06); border-color: var(--purple); color: var(--purple); }
.wp-code { background: var(--code-bg); border-radius: 10px; padding: 20px 24px; margin: 20px 0; overflow-x: auto; font-family: var(--mn); font-size: 13px; line-height: 1.7; color: var(--code-text); border: 1px solid var(--border); }
.wp-code .cm { color: var(--code-comment); }
.wp-code .kw { color: var(--code-keyword); }
.wp-code .st { color: var(--code-string); }
.wp-code .fn { color: var(--code-name); }
.wp-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
.wp-table th { background: var(--surface2); color: var(--t1); padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.wp-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--t2); vertical-align: top; line-height: 1.5; }
.wp-table tr:last-child td { border-bottom: none; }
.wp-dl { padding: 0; margin: 24px 0; text-align: center; }
.wp-dl a { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; border-radius: 100px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #060608; font-weight: 700; font-size: 14px; text-decoration: none; transition: all 0.3s; font-family: var(--hd); }
.wp-dl a:hover { opacity: 0.9; transform: translateY(-1px); }
.wp-meta { display: flex; gap: 24px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
.wp-meta-item { font-family: var(--mn); font-size: 12px; color: var(--t3); }

/* ═══ RESPONSIVE — TABLET ═══ */
@media (max-width: 1024px) {
  .wrap { padding: 0 20px; }
  .sec { padding: 72px 0; }
  .hero h1 { font-size: clamp(28px, 4.5vw, 48px); }
  .how-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
  .how-code { position: static !important; max-width: 640px; margin: 0 auto; }
  .pipe-steps { max-width: 560px; margin: 0 auto; }
  .feat-grid { grid-template-columns: repeat(2, 1fr); }
  .price-grid { grid-template-columns: repeat(3, 1fr); max-width: 960px; }
  .campaign-grid { grid-template-columns: repeat(4, 1fr) !important; }
}

/* ═══ RESPONSIVE — MOBILE ═══ */
@media (max-width: 768px) {
  .burger { display: flex; }
  .nav-links { display: none; }
  .nav-inner { height: 56px; }
  .hero { padding: 48px 0 36px; }
  .hero h1 { font-size: 26px; letter-spacing: -0.5px; line-height: 1.2; }
  .hero-sub { font-size: 15px; max-width: 100%; }
  .sec { padding: 56px 0; }
  .sec-hd { margin-bottom: 28px; }
  .sec-title { font-size: 22px; letter-spacing: -0.5px; }
  .sec-sub { font-size: 15px; }
  .feat-grid { grid-template-columns: 1fr; gap: 10px; }
  .feat-card { padding: 20px; }
  .card-icon { width: 40px; height: 40px; font-size: 18px; }
  .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 16px 8px; }
  .stat-num { font-size: 22px; }
  .stat-label { font-size: 10px; }
  .demo { max-width: 100%; }
  .demo-body { padding: 16px; min-height: 200px; }
  .demo-tab { padding: 10px 8px; font-size: 12px; }
  .chat-bubble { font-size: 13px; padding: 10px 14px; max-width: 100%; }
  .price-grid { max-width: 100%; grid-template-columns: 1fr; }
  .price-card { padding: 28px; }
  .community-links { flex-direction: column; }
  .community-link { min-width: unset; }

async function submitForm(url, data, setStatus) {
  setStatus('sending');
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(data)});

  } catch(e) { setStatus('error'); }
}

// ═══ SCROLL REVEAL HOOK ═══
function useSR() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add('vis'); ob.disconnect(); } }, {threshold: 0.15});
    ob.observe(el);
    return () => ob.disconnect();
  }, []);
  return ref;
}
function SR({children, className='', delay=''}) {
  const ref = useSR();
  return <div ref={ref} className={`sr ${delay} ${className}`}>{children}</div>;
}

// ═══ COPY ═══
function copyText(text, btn) {
  navigator.clipboard?.writeText(text).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
  if (btn) { const o = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = o, 1200); }
}

// ═══ RESEARCH / WHITEPAPER ═══
function ResearchSection() {
  const [expanded, setExpanded] = useState(false);
  return (
    <section className="sec" id="research">
      <div className="wrap">
        <SR>
          <div className="sec-hd center">
            <div className="sec-label" style={{color:'var(--purple)', textAlign:'center'}}>Security Research</div>
            <h2 className="sec-title" style={{textAlign:'center', maxWidth:700, margin:'0 auto'}}>Why Every Credential Manager on Linux Has the Same Vulnerability</h2>
            <div className="sec-sub center" style={{maxWidth:600}}>And how two forgotten kernel APIs close it.</div>
            <div className="wp-meta" style={{marginTop:20}}>
              <span className="wp-meta-item">The Hermetic Project</span>
              <span className="wp-meta-item">April 2026</span>
              <span className="wp-meta-item">~2,600 words</span>
            </div>
          </div>
        </SR>

        <div className="wp-article">
          <SR>
            <div className="wp-h1">1. The Assumption Everyone Makes</div>
            <p className="wp-p">Every credential manager on Linux trusts the same boundary: the Unix user ID. If a process runs as your UID, it can connect to your SSH agent socket, read your HashiCorp Vault token, access the credentials in your environment variables, and communicate with any daemon you own. This is not a bug in any individual product. It is the shared, unexamined foundation of Linux credential security.</p>
            <p className="wp-p">Major password managers and credential tools document that their SSH agents restrict access solely by file permissions on the agent socket or named pipe. Secret management systems authenticate clients using bearer tokens that carry no process-level identity. CLI credential helpers inject temporary credentials as environment variables readable by any same-UID process via <code>/proc/pid/environ</code>. Products following this pattern include 1Password, HashiCorp Vault, aws-vault, OpenSSH's ssh-agent, and GPG's gpg-agent.</p>
            <p className="wp-p">The reasoning was straightforward and, until recently, correct. If an attacker is already executing code as your user, they can read every file you own — browser cookies, shell history, cloud credentials, SSH keys. Protecting one daemon's socket while every flat file on disk is readable would be security theater. The accepted wisdom was simple: <strong>if they are running code as you, you have already lost.</strong></p>
            <p className="wp-p">This paper argues that this assumption is now wrong, explains why, demonstrates a specific exploit that breaks the most common fix, and describes the correct solution.</p>
          </SR>

          <SR delay="sr-d1">
            <div className="wp-h1">2. What Changed: AI Agents Execute Code by Design</div>
            <p className="wp-p">AI coding agents changed the equation. Claude Code, GitHub Copilot, Cursor, Windsurf, and similar tools routinely execute shell commands as the user's UID. This is their intended functionality, not an exploit. The agent reads a task description, generates a shell command, and executes it.</p>
            <p className="wp-p">These agents are susceptible to prompt injection. Attacker-controlled text in a GitHub issue, a code comment, a pull request description, or an API error response can redirect the agent's behavior. A carefully crafted comment can instruct the agent to read credentials from a daemon socket and exfiltrate them.</p>
            <table className="wp-table">
              <thead><tr><th>Precondition</th><th>Before AI Agents</th><th>With AI Agents</th></tr></thead>
              <tbody>
                <tr><td>Attacker has code execution as target UID</td><td>Requires prior compromise</td><td>Default — agents execute shell by design</td></tr>
                <tr><td>Attacker knows the daemon protocol</td><td>Requires reverse engineering</td><td>Public source code; agent reads it</td></tr>
                <tr><td>Attacker can write exploit code</td><td>Requires development skill</td><td>Agent generates exploit in seconds</td></tr>
                <tr><td>Attacker can exfiltrate results</td><td>Requires C2 infrastructure</td><td>Agent writes to file, embeds in output</td></tr>
                <tr><td>Vault is unlocked during attack</td><td>User must be actively working</td><td>Vault stays unlocked during session</td></tr>
              </tbody>
            </table>
            <p className="wp-p">The supply chain attack vector already demonstrated this pattern. The event-stream npm compromise (2018), the ua-parser-js attack (2021), and the Axios npm supply chain attack (March 2026, affecting millions of weekly downloads) all executed automated credential theft under the developer's UID. AI agents collapse the attack further: a poisoned comment in a repository the agent is working on is sufficient.</p>
            <div className="wp-callout warn">⚠ Every precondition for same-UID credential theft is the default state for developers using AI coding agents. This is not a theoretical risk. It is the expected operating environment.</div>
          </SR>

          {!expanded && (
            <SR delay="sr-d1">
              <div style={{textAlign:'center', margin:'40px 0'}}>
                <button onClick={() => setExpanded(true)} style={{display:'inline-flex',alignItems:'center',gap:10,padding:'14px 32px',borderRadius:100,background:'var(--card-bg)',border:'1px solid var(--card-border)',fontSize:14,color:'var(--t1)',cursor:'pointer',fontFamily:'var(--hd)',fontWeight:600,transition:'all 0.3s'}}>
                  Continue reading — 5 more sections ↓
                </button>
              </div>
            </SR>
          )}

          {expanded && (<>
            <SR>
              <div className="wp-h1">3. The Obvious Fix: Binary Attestation via /proc/pid/exe</div>
              <p className="wp-p">The obvious fix is process identity verification. On Linux, the kernel exposes the executable path of any process via <code>/proc/pid/exe</code>, a special symbolic link that resolves to the binary loaded during <code>execve()</code>. Unlike <code>/proc/pid/cmdline</code>, which the process can modify at any time, <code>/proc/pid/exe</code> is set by the kernel and cannot be changed without <code>CAP_SYS_ADMIN</code>.</p>
              <p className="wp-p">A robust implementation opens <code>/proc/peer_pid/exe</code> as a file descriptor, reads the binary contents, and computes a SHA-256 hash. It compares this against its own hash, computed from <code>/proc/self/exe</code> at startup. A hash mismatch means the connecting process is not the expected binary.</p>
              <p className="wp-p">This approach has real precedent. SPIFFE/SPIRE's Unix Workload Attestor uses <code>/proc/pid/exe</code> to identify workloads. Polkit historically used it for authorization decisions. Snapd uses it for snap confinement verification. It works. Until it doesn't.</p>
            </SR>

            <SR delay="sr-d1">
              <div className="wp-h1">4. Two Exploits That Break Binary Attestation</div>
              <div className="wp-h2">4.1 The FD-Sharing Race</div>
              <p className="wp-p">Binary attestation via <code>/proc/pid/exe</code> has a time-of-check-to-time-of-use vulnerability. File descriptors survive <code>fork()</code> and <code>exec()</code>. This creates an attack chain:</p>
              <p className="wp-p"><strong>Step 1.</strong> The attacker's Python script creates a Unix socket connected to the daemon. <strong>Step 2.</strong> The script calls <code>fork()</code>. The child inherits the socket fd. <strong>Step 3.</strong> The child calls <code>execve()</code> on the legitimate binary — its <code>/proc/pid/exe</code> now points to the real binary. <strong>Step 4.</strong> The parent (still Python) sends an attestation request on the shared socket. <code>SO_PEERCRED</code> returns the child's PID; the daemon reads the child's <code>/proc/pid/exe</code>; hash matches; token issued. <strong>Step 5.</strong> The parent receives the token and has authenticated access.</p>
              <p className="wp-p">During adversarial validation, an AI attack simulation produced a working exploit script that extracted a valid session token. We attempted multiple mitigations including accept-time hashing, challenge-response protocols, and per-PID token binding. All failed because the attacker controls the timing of <code>execve()</code> — the child becomes the legitimate binary before any daemon code runs.</p>
              <div className="wp-callout info">◆ The FD-sharing exploit was discovered and operationalized by an AI adversarial auditor during our security validation — demonstrating that the same AI capabilities that enable prompt-injection attacks can also find and exploit credential infrastructure vulnerabilities.</div>
              <p className="wp-p">This vulnerability class is not new. CVE-2013-4288 in polkit exploited the same TOCTOU pattern, triggering a cascade of seven related CVEs. CVE-2019-5736 in runc exploited <code>/proc/pid/exe</code> in the opposite direction. Yet every credential manager that uses socket-level authentication still relies on <code>SO_PEERCRED</code> alone.</p>

              <div className="wp-h2">4.2 Token Theft via /proc/pid/mem</div>
              <p className="wp-p">There is a subtler attack that survives even after the FD-sharing race is closed. Binary attestation requires the daemon to read <code>/proc/peer_pid/exe</code>. This requires the client's dumpable attribute to be 1. Setting <code>PR_SET_DUMPABLE=0</code> blocks the read. The client must keep <code>DUMPABLE=1</code> during attestation, then set it to 0 after receiving the session token.</p>
              <p className="wp-p">That constraint opens a window. Between process start and attestation completion, the client's <code>/proc/pid/mem</code> is readable by any same-UID process. On Linux, file descriptor permissions are evaluated at open() time. Once granted, subsequent dumpable changes do not revoke the fd. If the session token is a bearer credential — valid from any process, any PID — an attacker who extracts it from memory can present it from their own process and gain full authenticated access.</p>
              <div className="wp-callout warn">⚠ The attestation window that enables binary verification also creates a memory-read window. The defense creates the vulnerability. This tension is inherent to any /proc-based attestation scheme on Linux.</div>
            </SR>

            <SR delay="sr-d1">
              <div className="wp-h1">5. Two Fixes, Both Already in the Kernel</div>
              <div className="wp-h2">5.1 Sender Verification: SCM_CREDENTIALS</div>
              <p className="wp-p">The FD-sharing race exploits a semantic mismatch. <code>SO_PEERCRED</code> answers "who called <code>connect()</code>?" The credentials are recorded once and never updated. After <code>fork()</code>, the parent inherits the fd but <code>SO_PEERCRED</code> still identifies the child.</p>
              <p className="wp-p">The Linux kernel has provided the correct mechanism since version 2.2: <strong>SCM_CREDENTIALS</strong>. When a socket has <code>SO_PASSCRED</code> enabled, the kernel attaches the sender's credentials (PID, UID, GID) to every message via <code>recvmsg()</code>. These are verified by the kernel at send time. Unforgeable without <code>CAP_SYS_ADMIN</code>.</p>
              <p className="wp-p">The implementation is approximately 35 lines of code:</p>
              <div className="wp-code">
                <span className="cm">// After accept(), enable per-message credential verification</span><br/>
                <span className="fn">setsockopt</span>(accepted_fd, SOL_SOCKET, SO_PASSCRED, &amp;1)<br/><br/>
                <span className="cm">// On each received message, extract kernel-verified sender PID</span><br/>
                <span className="kw">let</span> sender_pid = <span className="fn">recvmsg</span>(fd, MSG_PEEK).<span className="fn">extract_scm_credentials</span>().pid;<br/>
                <span className="kw">let</span> connect_pid = peercred.pid;<br/><br/>
                <span className="kw">if</span> sender_pid != connect_pid {'{'}<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;<span className="cm">// Someone other than the original connector is sending</span><br/>
                &nbsp;&nbsp;&nbsp;&nbsp;<span className="fn">reject_and_audit</span>(<span className="st">"sender PID mismatch"</span>);<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;<span className="fn">close</span>(fd);<br/>
                {'}'}
              </div>

              <div className="wp-h2">5.2 Token Binding: Tokens Are Not Bearer Credentials</div>
              <p className="wp-p"><code>SCM_CREDENTIALS</code> closes the FD-sharing race but does not close the <code>/proc/pid/mem</code> attack. That attack uses a clean connection with no fd sharing.</p>
              <p className="wp-p">The fix is to bind the token to the process that attested. When the daemon issues a session token, it records the attesting process's PID. On every subsequent request, it compares the presenting PID against the stored PID. A mismatch means someone other than the original attestor is using the token.</p>
              <p className="wp-p">This is approximately 15 lines of code — a PID comparison in the token verification path plus token cleanup when the attesting connection closes. Combined, these eliminate both the theft vector and the PID recycling edge case.</p>
              <p className="wp-p">The stolen token is now worthless. The attacker reads it from memory (PID Y), presents it from Python (PID X), and the daemon rejects it because X ≠ Y.</p>
              <div className="wp-callout ok">✓ Both fixes use kernel primitives that have existed for decades. SCM_CREDENTIALS: Linux 2.2, January 1999. SO_PEERCRED PID for token binding: available since Unix domain sockets were introduced. The mechanisms that close these vulnerabilities were always there.</div>
            </SR>

            <SR delay="sr-d1">
              <div className="wp-h1">6. Defense in Depth</div>
              <p className="wp-p"><strong>PR_SET_DUMPABLE=0</strong> blocks same-UID processes from reading <code>/proc/pid/exe</code>, <code>/proc/pid/mem</code>, <code>/proc/pid/environ</code>, and <code>/proc/pid/fd/</code>. The client must complete attestation before setting DUMPABLE=0. PID-bound tokens make the attestation window unexploitable for token theft, but the design constraint remains: no secret material should exist in client memory before DUMPABLE=0 is set.</p>
              <p className="wp-p"><strong>Library injection defense</strong> addresses the LD_PRELOAD attack vector. The daemon checks for injected libraries at startup and aborts if detected. Static linking (planned for a future release) eliminates this vector entirely by removing the dynamic linker. Until then, the startup canary provides detection rather than prevention.</p>
              <p className="wp-p"><strong>Scoped session tokens</strong> with configurable TTL limit blast radius. Each client type gets only the operations it needs. A compromised component with a narrowly scoped token cannot escalate.</p>
              <p className="wp-p"><strong>Inherited pipe file descriptors</strong> provide a second channel for token delivery. Pipe contents never appear in <code>/proc/pid/environ</code> or <code>/proc/pid/cmdline</code>. With DUMPABLE=0, the pipe fd is invisible via <code>/proc/pid/fd/</code>.</p>
              <p className="wp-p">No single mechanism is sufficient. Binary attestation catches impersonation. SCM_CREDENTIALS closes the FD-sharing race. PID-bound tokens close the memory-theft vector. DUMPABLE blocks inspection outside the attestation window. Library injection detection catches LD_PRELOAD attacks at startup. Scoped tokens limit lateral movement. They compose into a defense that no single bypass defeats.</p>
            </SR>

            <SR delay="sr-d1">
              <div className="wp-h1">7. What This Means for the Industry</div>
              <p className="wp-p">Every credential manager, secret agent, and authentication daemon on Linux that uses Unix domain sockets for local IPC faces these vulnerabilities. The FD-sharing race exploits the gap between who connected and who is sending. The memory-theft attack exploits the attestation window that binary verification requires. Both are exploitable with under 50 lines of Python. Both are closed by kernel primitives that have existed for decades.</p>
              <p className="wp-p">The fixes are not complex. SCM_CREDENTIALS is approximately 35 lines. PID-bound tokens with connection-close cleanup are approximately 15 lines. The total cost of closing both attack surfaces is under 50 lines of code in any language that supports Unix socket ancillary messages.</p>
              <p className="wp-p">We discovered these vulnerabilities while building Hermetic, a credential isolation daemon for AI agents. The cryptographic core is open source. The adversarial validation that found both exploits and the kernel-level fixes are documented in the source code.</p>
            </SR>
          </>)}

          <SR delay="sr-d1">
            <div className="wp-dl">
              <a href="https://github.com/hermetic-sys/hermetic" target="_blank" rel="noopener">View on GitHub →</a>
            </div>
          </SR>
        </div>
      </div>
    </section>
  );
}

        </div>
      </div>
      <button className={`drawer-item${section===null?' active':''}`} onClick={() => {navTo(null);closeMenu();}}>Home</button>
      {SECTIONS.map(s => (
        <button key={s.id} className={`drawer-item${section===s.id?' active':''}`} onClick={() => {navTo(s.id);closeMenu();}}>{s.name}</button>
      ))}
    </div>
  </>);
}

// ═══ APP ═══
function App() {
  const [section, setSection] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('hermetic-theme') || 'dark'; } catch(e) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('hermetic-theme', theme); } catch(e) {}
  }, [theme]);
  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  const navTo = (id) => {
    if (id && document.getElementById(id)) {
      document.getElementById(id).scrollIntoView({behavior:'smooth'});
    } else if (id === 'start') {
      const el = document.getElementById('start');
      if (el) el.scrollIntoView({behavior:'smooth'});
      else { setSection(null); setTimeout(() => document.getElementById('start')?.scrollIntoView({behavior:'smooth'}), 100); }
    } else {
      setSection(null);
      window.scrollTo({top:0, behavior:'smooth'});
    }
  };

  return (<>
    <Nav section={section} navTo={navTo} theme={theme} toggleTheme={toggleTheme} />
    <Hero navTo={navTo} />
    <div className="divider" />
    <HowSection />
    <ProxySection />
    <div className="divider" />
    <FeaturesSection />
    <EcosystemSection />
    <div className="divider" />
    <ProofSection />
    <div className="divider" />
    <ResearchSection />
    <InstallSection />
    <div className="divider" />
    <PricingSection />
    <div className="divider" />
    <DocsSection />
    <ContactForm />
    <Footer />
  </>);
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
