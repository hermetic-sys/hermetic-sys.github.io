  --code-bg: #0f1015;
  --code-kw: #c5a5ff;
  --code-str: #7eddc7;
  --code-fn: #72c4f7;
  --code-num: #f3c144;
  --code-cm: #7e8498;
  --sel: rgba(15,132,120,0.20);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.05), 0 6px 24px rgba(0,0,0,0.05);
  --shadow-2: 0 4px 28px rgba(15,132,120,0.10);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--sel); color: var(--t1); }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--t1); font-family: var(--hd); font-size: 15px;
  line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  transition: background 0.5s, color 0.5s;
}

/* ── TYPOGRAPHY SCALE ──────────────────────────────────────────── */
/* Canonical scale: 11 · 13 · 15 · 17 · 20 · 24 · 32-44(h2) · 48-78(h1) */
h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.02em; color: var(--t1); line-height: 1.1; }
h1 { font-size: clamp(40px, 6.5vw, 78px); font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: clamp(32px, 3.8vw, 48px); font-weight: 700; letter-spacing: -0.025em; }
h3 { font-size: 24px; font-weight: 700; }
h4 { font-size: 17px; font-weight: 600; }
p { color: var(--t2); font-size: 15px; line-height: 1.65; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--mn); font-size: 0.86em; background: var(--card); padding: 1px 6px; border-radius: 4px; color: var(--t1); border: 1px solid var(--card-border); }

/* ── LAYOUT ────────────────────────────────────────────────────── */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.wrap-narrow { max-width: 820px; margin: 0 auto; padding: 0 24px; }
.wrap-wide { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
.sec { padding: 120px 0; position: relative; }
.sec-tight { padding: 80px 0; }
.sec-bg { background: var(--bg-elev); }
.sec-head { margin-bottom: 56px; }
.sec-head.center { text-align: center; }
.sec-head.center > * { margin-left: auto; margin-right: auto; }
.eyebrow { font-family: var(--mn); font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.sec-title { font-size: clamp(34px, 4.3vw, 50px); color: var(--t1); line-height: 1.15; }
.sec-sub { font-size: 17px; color: var(--t2); max-width: 640px; margin-top: 16px; line-height: 1.65; }

/* ── NAV ───────────────────────────────────────────────────────── */
.nav { position: sticky; top: 0; z-index: 100; background: var(--glass); border-bottom: 1px solid transparent; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: border-color 0.3s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
.nav-logo img { height: 38px; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link { background: none; border: none; cursor: pointer; font-family: var(--hd); font-size: 14px; font-weight: 500; color: var(--t2); padding: 8px 14px; border-radius: 8px; transition: all 0.2s; }
.nav-link:hover, .nav-link.active { color: var(--t1); background: var(--card-h); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.theme-btn { background: transparent; border: 1px solid var(--line); color: var(--t2); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; transition: all 0.2s; font-size: 13px; }
.theme-btn:hover { color: var(--accent); border-color: var(--accent-mid); }
.nav-cta { padding: 9px 18px; background: var(--t1); color: var(--bg); border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: var(--hd); transition: all 0.2s; }
.nav-cta:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.burger { display: none; background: none; border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; color: var(--t1); flex-direction: column; gap: 4px; align-items: center; justify-content: center; padding: 0; }
.burger span { width: 16px; height: 1.5px; background: currentColor; transition: transform 0.3s; }
.burger.open span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.drawer { position: fixed; inset: 0; z-index: 99; background: var(--bg); padding: 72px 24px 40px; display: flex; flex-direction: column; gap: 4px; transform: translateX(100%); transition: transform 0.3s ease; }
.drawer.open { transform: translateX(0); }
.drawer-item { background: none; border: none; cursor: pointer; font-family: var(--hd); font-size: 18px; font-weight: 500; color: var(--t2); padding: 14px 8px; text-align: left; border-radius: 8px; }
.drawer-item.active { color: var(--accent); }

/* ── BUTTONS ───────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: var(--hd); border: none; transition: all 0.2s; text-decoration: none; line-height: 1; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.btn-secondary { background: transparent; color: var(--t1); border: 1px solid var(--line-h); }
.btn-secondary:hover { border-color: var(--t2); background: var(--card-h); }
.btn-ghost { background: transparent; color: var(--t2); padding: 8px 14px; }
.btn-ghost:hover { color: var(--accent); }

/* ── CARDS ─────────────────────────────────────────────────────── */
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; transition: all 0.25s; }
.card.hov:hover { border-color: var(--card-border-h); background: var(--card-h); transform: translateY(-1px); }
.card-flat { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }

/* ── PILLS / TAGS ──────────────────────────────────────────────── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-family: var(--mn); font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--card-border); background: var(--card); color: var(--t2); }
.pill-accent { border-color: var(--accent-mid); background: var(--accent-soft); color: var(--accent); }
.pill-green  { border-color: rgba(74,222,128,0.2); background: var(--green-soft); color: var(--green); }
.pill-gold   { border-color: rgba(243,193,68,0.2); background: var(--gold-soft); color: var(--gold); }
.pill-purple { border-color: rgba(169,128,255,0.2); background: var(--purple-soft); color: var(--purple); }
.pill-red    { border-color: rgba(255,92,108,0.2); background: var(--red-soft); color: var(--red); }
.pill-blue   { border-color: rgba(74,139,255,0.2); background: var(--blue-soft); color: var(--blue); }

/* ── CODE BLOCKS ───────────────────────────────────────────────── */
.codeblock { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-family: var(--mn); }
.codeblock-hd { padding: 10px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--t3); }
.codeblock-body { padding: 18px 20px; font-size: 13px; line-height: 1.75; color: var(--t1); overflow-x: auto; white-space: pre; }
[data-theme="light"] .codeblock-body { color: #e6e8ee; }
.copy-btn { background: transparent; border: 1px solid var(--line-h); color: var(--t2); padding: 3px 10px; border-radius: 6px; font-family: var(--mn); font-size: 11px; cursor: pointer; transition: all 0.2s; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent-mid); }
.cm { color: var(--code-cm); }
.kw { color: var(--code-kw); }
.st { color: var(--code-str); }
.fn { color: var(--code-fn); }
.nu { color: var(--code-num); }
.pp { color: var(--t3); }

/* ── HERO ──────────────────────────────────────────────────────── */
.hero { padding: 80px 0 100px; position: relative; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; }
.hero-bg::before { content: ''; position: absolute; top: -40%; left: 50%; transform: translateX(-50%); width: 1400px; height: 800px; background: radial-gradient(ellipse at center, rgba(61,217,207,0.14) 0%, transparent 55%); }
.hero-bg::after { content: ''; position: absolute; top: 10%; left: 20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(169,128,255,0.08) 0%, transparent 70%); }
.hero-in { position: relative; text-align: center; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 100px; background: var(--card); border: 1px solid var(--card-border); font-family: var(--mn); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--t2); margin-bottom: 32px; }
.hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.hero h1 { max-width: 920px; margin: 0 auto 24px; }
.hero h1 .accent { color: var(--accent); }
.hero-sub { font-size: clamp(17px, 1.6vw, 20px); color: var(--t2); max-width: 680px; margin: 0 auto 40px; line-height: 1.55; }

/* Word carousel */
.carousel {
  position: relative;
  display: inline-block;
  vertical-align: baseline;
  height: 1.05em;
  overflow: visible;
  transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
.carousel-sizer {
  visibility: hidden;
  pointer-events: none;
  white-space: nowrap;
  display: inline-block;
}
.carousel-word {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  transform: translateY(96%);
  transition: transform 0.55s cubic-bezier(0.32, 0.72, 0.2, 1), opacity 0.45s ease;
  white-space: nowrap;
  will-change: transform, opacity;
  font-style: italic;
}
.carousel-word.active {
  opacity: 1;
  transform: translateY(0);
}
.carousel-word.exit {
  opacity: 0;
  transform: translateY(-96%);
  transition: transform 0.55s cubic-bezier(0.32, 0.72, 0.2, 1), opacity 0.45s ease;
}

.hero-cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 72px; }
.hero-diagram { max-width: 860px; margin: 0 auto; }

/* Hero flow diagram */
.flow { background: var(--card-h); border: 1px solid var(--card-border); border-radius: 20px; padding: 32px; position: relative; overflow: hidden; }
.flow-grid { display: grid; grid-template-columns: 1fr auto 1.3fr auto 1fr; gap: 16px; align-items: center; }
.flow-node { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; text-align: center; position: relative; }
.flow-node.hub { border-color: var(--accent-mid); background: var(--accent-soft); }
.flow-label { font-family: var(--mn); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--t3); margin-bottom: 6px; }
.flow-node.hub .flow-label { color: var(--accent); }
.flow-title { font-size: 15px; font-weight: 600; color: var(--t1); margin-bottom: 4px; }
.flow-sub { font-size: 13px; color: var(--t3); font-family: var(--mn); }
.flow-arrow { position: relative; width: 56px; height: 24px; display: flex; align-items: center; justify-content: center; }
.flow-arrow::before { content: ''; position: absolute; left: 0; right: 8px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-strong), var(--accent)); }
.flow-arrow::after { content: ''; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 4px solid transparent; border-left-color: var(--accent); border-right: 0; }
.flow-arrow.back::before { background: linear-gradient(90deg, var(--accent), var(--accent-strong), transparent); }
.flow-arrow.back::after { right: auto; left: 6px; transform: translateY(-50%) rotate(180deg); }
.flow-notes { margin-top: 22px; padding: 14px 18px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-family: var(--mn); font-size: 12px; color: var(--t2); letter-spacing: 0.3px; }
.flow-notes strong { color: var(--t1); font-weight: 500; }

.hero-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; max-width: 860px; margin: 48px auto 0; }
.hs { background: var(--bg-elev); padding: 20px 16px; text-align: center; }
.hs-n { font-family: var(--mn); font-size: 24px; font-weight: 600; color: var(--t1); letter-spacing: -0.02em; }
.hs-l { font-family: var(--mn); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--t3); margin-top: 4px; }

/* ── PROBLEM SECTION ───────────────────────────────────────────── */
.problem { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.attack-step { padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elev); margin-bottom: 10px; font-size: 15px; color: var(--t2); display: flex; gap: 14px; align-items: start; line-height: 1.55; }
.attack-step-num { font-family: var(--mn); font-size: 12px; color: var(--red); background: var(--red-soft); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; font-weight: 600; margin-top: 1px; }

/* ── MECHANISM SECTION ─────────────────────────────────────────── */
.tier-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
.tier-tab { padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-family: var(--hd); font-size: 14px; font-weight: 600; color: var(--t2); transition: all 0.2s; }
.tier-tab:hover { color: var(--t1); }
.tier-tab.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.tier-pane { max-width: 820px; margin: 0 auto; }
.tier-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.tier-name { font-size: 24px; font-weight: 700; color: var(--t1); }
.tier-exposure { font-family: var(--mn); font-size: 12px; color: var(--t1); padding: 6px 14px; border-radius: 100px; background: var(--card); border: 1px solid var(--card-border-h); letter-spacing: 1px; }

/* ── CREDENTIAL TYPES GRID ─────────────────────────────────────── */
.cred-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cred-card { padding: 22px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-elev); transition: all 0.2s; position: relative; overflow: hidden; }
.cred-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.cred-card:hover { transform: translateY(-2px); border-color: var(--card-border-h); }
.cred-icon { font-size: 24px; margin-bottom: 10px; display: block; }
.cred-name { font-size: 17px; font-weight: 700; color: var(--t1); margin-bottom: 4px; }
.cred-scope { font-family: var(--mn); font-size: 11px; color: var(--t3); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 12px; }
.cred-use { font-size: 13.5px; color: var(--t2); line-height: 1.6; }
.cred-edition { position: absolute; top: 18px; right: 16px; font-family: var(--mn); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

/* ── PROXY SECTION ─────────────────────────────────────────────── */
.proxy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.proxy-col { }
.proxy-lbl { font-family: var(--mn); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
.proxy-note { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.55; text-align: center; }

/* ── ARCHITECTURE ──────────────────────────────────────────────── */
.arch { padding: 40px 32px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 20px; }
.arch-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 16px; }
.arch-label { width: 120px; font-family: var(--mn); font-size: 11px; color: var(--t3); letter-spacing: 1.5px; text-transform: uppercase; padding-top: 14px; flex-shrink: 0; }
.arch-boxes { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.arch-box { flex: 1 1 140px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; color: var(--t1); transition: all 0.2s; }
.arch-box-name { font-family: var(--mn); font-size: 13px; font-weight: 600; color: var(--t1); margin-bottom: 4px; }
.arch-box-desc { font-size: 12px; color: var(--t3); line-height: 1.55; }
.arch-box.open { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.03); }
.arch-box.open .arch-box-name { color: var(--green); }
.arch-box.prop { border-color: rgba(61,217,207,0.25); background: rgba(61,217,207,0.04); }
.arch-box.prop .arch-box-name { color: var(--accent); }
.arch-legend { display: flex; gap: 22px; margin-top: 8px; font-family: var(--mn); font-size: 11px; color: var(--t3); flex-wrap: wrap; }
.arch-legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }

/* ── EVIDENCE DASHBOARD ────────────────────────────────────────── */
.ev-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ev-tile { background: var(--bg-elev); padding: 28px 22px; }
.ev-n { font-family: var(--mn); font-size: 36px; font-weight: 600; color: var(--t1); letter-spacing: -0.03em; line-height: 1; margin-bottom: 6px; }
.ev-l { font-family: var(--mn); font-size: 11px; color: var(--t3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
.ev-d { font-size: 13px; color: var(--t2); line-height: 1.6; }

.vuln-list { margin-top: 32px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.vuln-row { display: grid; grid-template-columns: 120px 1fr 160px; gap: 20px; padding: 16px 22px; border-top: 1px solid var(--line); align-items: center; }
.vuln-row:first-child { border-top: none; background: var(--bg-elev); }
.vuln-row.hd { font-family: var(--mn); font-size: 11px; color: var(--t3); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; padding: 12px 22px; }
.vuln-n { font-family: var(--mn); font-size: 13px; color: var(--t2); font-weight: 500; }
.vuln-d { font-size: 14.5px; color: var(--t1); font-weight: 500; line-height: 1.4; }
.vuln-s { font-family: var(--mn); font-size: 11px; color: var(--green); letter-spacing: 1.2px; text-transform: uppercase; text-align: right; }

/* ── OPEN CORE ─────────────────────────────────────────────────── */
.oc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.oc-col { padding: 32px 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg-elev); position: relative; overflow: hidden; }
.oc-col::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.oc-col.open::before { background: var(--green); }
.oc-col.prop::before { background: var(--accent); }
.oc-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.oc-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
.oc-col.open .oc-icon { background: var(--green-soft); border: 1px solid rgba(74,222,128,0.3); }
.oc-col.prop .oc-icon { background: var(--accent-soft); border: 1px solid var(--accent-mid); }
.oc-eyebrow { font-family: var(--mn); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.oc-col.open .oc-eyebrow { color: var(--green); }
.oc-col.prop .oc-eyebrow { color: var(--accent); }
.oc-title { font-size: 20px; font-weight: 700; color: var(--t1); }
.oc-desc { font-size: 15px; color: var(--t2); line-height: 1.65; margin-bottom: 20px; }
.oc-crate { padding: 12px 14px; border-radius: 9px; margin-bottom: 8px; }
.oc-col.open .oc-crate { background: rgba(74,222,128,0.04); border: 1px solid rgba(74,222,128,0.14); }
.oc-col.prop .oc-crate { background: rgba(61,217,207,0.04); border: 1px solid var(--accent-mid); }
.oc-crate-n { font-family: var(--mn); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.oc-col.open .oc-crate-n { color: var(--green); }
.oc-col.prop .oc-crate-n { color: var(--accent); }
.oc-crate-d { font-size: 12.5px; color: var(--t3); line-height: 1.5; }
.oc-quote { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--t3); font-style: italic; line-height: 1.65; }
.oc-logic { max-width: 760px; margin: 40px auto 0; padding: 26px 30px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-border); text-align: center; }
.oc-logic-lbl { font-family: var(--mn); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--purple); margin-bottom: 12px; font-weight: 600; }
.oc-logic-txt { font-size: 16px; color: var(--t2); line-height: 1.7; }
.oc-logic-txt strong { color: var(--t1); font-weight: 600; }

/* ── PRICING ───────────────────────────────────────────────────── */
.pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1060px; margin: 0 auto; }
.price-card { position: relative; padding: 32px 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg-elev); overflow: hidden; transition: all 0.2s; }
.price-card:hover { transform: translateY(-1px); }
.price-card.featured { border-color: var(--accent-mid); background: var(--accent-soft); }
.price-card.featured::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--blue)); }
.price-badge { position: absolute; top: 0; left: 0; right: 0; padding: 5px 0; text-align: center; font-family: var(--mn); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
.price-badge.avail { background: var(--blue); color: var(--bg); }
.price-badge.soon { background: var(--accent); color: var(--bg); }
.price-name { font-family: var(--mn); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.price-amt { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-bottom: 6px; color: var(--t1); }
.price-sub { font-size: 13.5px; color: var(--t3); margin-bottom: 28px; }
.price-feat { list-style: none; margin-bottom: 32px; }
.price-feat li { font-size: 14px; color: var(--t2); padding: 8px 0; border-bottom: 1px solid var(--card-border); display: flex; gap: 10px; align-items: start; line-height: 1.5; }
.price-feat li:last-child { border-bottom: none; }
.price-feat li::before { content: '✓'; color: var(--accent); font-weight: 700; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
.price-btn { display: block; width: 100%; padding: 13px; text-align: center; border-radius: 10px; font-weight: 600; font-size: 14.5px; cursor: pointer; font-family: var(--hd); text-decoration: none; transition: all 0.2s; }
.price-btn.primary { background: var(--accent); color: var(--bg); border: none; }
.price-btn.primary:hover { transform: translateY(-1px); }
.price-btn.sec { background: var(--card); color: var(--t1); border: 1px solid var(--line-h); }
.price-btn.sec:hover { background: var(--card-h); }

/* ── FAQ ───────────────────────────────────────────────────────── */
.faq { max-width: 760px; margin: 64px auto 0; }
.faq-item { border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; background: var(--bg-elev); transition: all 0.2s; }
.faq-item:hover { border-color: var(--card-border-h); }
.faq-q { padding: 16px 20px; font-size: 15.5px; font-weight: 600; color: var(--t1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; user-select: none; line-height: 1.35; }
.faq-plus { color: var(--t3); transition: transform 0.25s; font-family: var(--mn); font-size: 18px; font-weight: 300; flex-shrink: 0; }
.faq-q.open .faq-plus { transform: rotate(45deg); color: var(--accent); }
.faq-a { padding: 0 20px 18px; font-size: 14.5px; color: var(--t2); line-height: 1.7; }

/* ── WHITEPAPER ────────────────────────────────────────────────── */
.wp { max-width: 760px; margin: 0 auto; }
.wp-meta { display: flex; gap: 24px; justify-content: center; margin-top: 8px; margin-bottom: 40px; flex-wrap: wrap; }
.wp-meta span { font-family: var(--mn); font-size: 11.5px; color: var(--t3); }
.wp h3 { font-size: 22px; font-weight: 700; color: var(--t1); margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); letter-spacing: -0.02em; }
.wp h4 { font-size: 16px; font-weight: 600; color: var(--accent); margin: 28px 0 10px; }
.wp p { font-size: 15.5px; color: var(--t2); line-height: 1.75; margin-bottom: 16px; }
.wp p strong { color: var(--t1); font-weight: 600; }
.wp-callout { padding: 14px 18px; border-radius: 10px; margin: 22px 0; font-size: 13.5px; line-height: 1.7; border-left: 3px solid; }
.wp-callout.warn { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.wp-callout.ok { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.wp-callout.info { background: var(--purple-soft); border-color: var(--purple); color: var(--purple); }
.wp-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
.wp-table th { background: var(--surface); color: var(--t1); padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--line); }
.wp-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--t2); vertical-align: top; line-height: 1.55; }
.wp-code { background: var(--code-bg); border-radius: 10px; padding: 18px 22px; margin: 20px 0; overflow-x: auto; font-family: var(--mn); font-size: 12.5px; line-height: 1.7; color: var(--t1); border: 1px solid var(--line); }
.wp-dl-wrap { text-align: center; margin: 40px 0 0; }
.wp-dl { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; border-radius: 100px; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 14px; text-decoration: none; transition: all 0.2s; font-family: var(--hd); }
.wp-dl:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.wp-more { text-align: center; margin: 40px 0; }
.wp-more button { padding: 12px 28px; border-radius: 100px; background: var(--card); border: 1px solid var(--card-border); font-size: 14px; color: var(--t1); cursor: pointer; font-family: var(--hd); font-weight: 600; transition: all 0.2s; }
.wp-more button:hover { border-color: var(--card-border-h); background: var(--card-h); }

/* ── INSTALL ───────────────────────────────────────────────────── */
.install { max-width: 720px; margin: 0 auto; }
.install-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
.install-tag { font-family: var(--mn); font-size: 11px; letter-spacing: 0.5px; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); color: var(--t3); }

/* ── FOOTER ────────────────────────────────────────────────────── */
.footer { border-top: 1px solid var(--line); padding: 48px 0 32px; }
.footer-in { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
.footer-c { font-family: var(--mn); font-size: 12px; color: var(--t3); }
.footer-links { display: flex; gap: 20px; }
.footer-links a { font-family: var(--mn); font-size: 12px; color: var(--t3); transition: color 0.2s; }
.footer-links a:hover { color: var(--accent); }

/* ── FORMS ─────────────────────────────────────────────────────── */
.form-in { display: flex; flex-direction: column; gap: 10px; }
.input { padding: 11px 14px; border-radius: 9px; background: var(--bg-elev); border: 1px solid var(--line); color: var(--t1); font-size: 14px; font-family: var(--hd); outline: none; transition: border-color 0.2s; width: 100%; }
.input:focus { border-color: var(--accent-mid); }
.input::placeholder { color: var(--t4); }

/* ── SCROLL REVEAL ─────────────────────────────────────────────── */
.sr { opacity: 0; transform: translateY(18px); transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.sr.vis { opacity: 1; transform: none; }
.sr-d1 { transition-delay: 0.08s; } .sr-d2 { transition-delay: 0.16s; } .sr-d3 { transition-delay: 0.24s; }

/* ── DIVIDER ───────────────────────────────────────────────────── */
.div-line { height: 1px; background: linear-gradient(90deg, transparent, var(--line-h) 50%, transparent); }

/* ── RESPONSIVE ────────────────────────────────────────────────── */

/* Tablet: 1100px down */
@media (max-width: 1100px) {
  .ev-grid { grid-template-columns: repeat(3, 1fr); }
  .ev-grid .ev-tile:nth-child(4),
  .ev-grid .ev-tile:nth-child(5) { border-top: 1px solid var(--line); }
  .hero-stats { grid-template-columns: repeat(5, 1fr); }
}

/* Smaller tablet / landscape phone */
@media (max-width: 1024px) {
  .sec { padding: 88px 0; }
  .problem, .oc-grid, .proxy-grid { grid-template-columns: 1fr; }

  /* Flow diagrams: stack vertically, rotate arrows */
  .flow-grid, .flow > div[style] { grid-template-columns: 1fr !important; gap: 10px !important; }
  .flow-arrow { transform: rotate(90deg); margin: 2px auto; width: 32px; height: 24px; }

  .pricing-grid { grid-template-columns: 1fr; max-width: 480px; }
  .ev-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-stats { grid-template-columns: repeat(3, 1fr); }
}

/* Mobile: 768px down */
@media (max-width: 768px) {
  .burger { display: flex; }
  .nav-links, .nav-cta { display: none; }
  .nav-right .theme-btn { display: inline-flex; }
  .nav-in { height: 64px; padding: 0 16px; }
  .nav-logo img { height: 34px; }

  .wrap, .wrap-narrow, .wrap-wide { padding: 0 18px; }
  .sec { padding: 64px 0; }
  .sec-head { margin-bottom: 36px; }

  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.03em; }
  h2 { font-size: 30px; }
  h3 { font-size: 20px; }
  .sec-title { font-size: 30px; line-height: 1.2; }
  .sec-sub { font-size: 15.5px; }

  .hero { padding: 40px 0 56px; }
  .hero-eyebrow { font-size: 10.5px; padding: 5px 12px; letter-spacing: 1.5px; margin-bottom: 24px; }
  .hero-sub { font-size: 15.5px; margin-bottom: 32px; }
  .hero-cta-row { margin-bottom: 48px; }
  .hero-cta-row .btn { width: 100%; justify-content: center; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .hs-n { font-size: 20px; }
  .hs-l { font-size: 10px; }

  /* Flow diagram mobile: tighter nodes */
  .flow { padding: 20px 14px; }
  .flow-node { padding: 14px 12px; }
  .flow-notes { flex-direction: column; gap: 6px; font-size: 11.5px; padding: 12px 14px; text-align: center; }

  /* Problem steps */
  .attack-step { font-size: 14px; padding: 12px 14px; gap: 10px; }
  .attack-step-num { width: 22px; height: 22px; font-size: 11px; }

  /* Tier tabs: scroll horizontally on very narrow */
  .tier-tabs { gap: 6px; padding: 0 2px; flex-wrap: wrap; }
  .tier-tab { padding: 9px 14px; font-size: 13px; }
  .tier-hdr { flex-direction: column; align-items: flex-start; gap: 10px; }
  .tier-name { font-size: 20px; word-break: break-word; }
  .tier-exposure { font-size: 11px; padding: 5px 11px; }

  /* Credential cards */
  .cred-card { padding: 18px 16px; }
  .cred-name { font-size: 16px; }
  .cred-use { font-size: 13px; }

  /* Architecture: stack labels on top of boxes */
  .arch { padding: 24px 18px; }
  .arch-row { flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .arch-label { width: 100%; padding: 0 0 2px; font-size: 10.5px; }
  .arch-boxes { width: 100%; }
  .arch-box { flex: 1 1 100%; padding: 12px 14px; }
  .arch-legend { font-size: 10.5px; gap: 14px; }

  /* Evidence tiles: single column */
  .ev-grid { grid-template-columns: 1fr; }
  .ev-tile { padding: 22px 20px; }
  .ev-n { font-size: 30px; }

  /* Vuln list */
  .vuln-row { grid-template-columns: 1fr; gap: 4px; padding: 14px 16px; }
  .vuln-row.hd { display: none; }
  .vuln-s { text-align: left; padding-top: 2px; }
  .vuln-n { font-size: 11px; color: var(--t3); letter-spacing: 1px; text-transform: uppercase; }

  /* Open core */
  .oc-col { padding: 24px 20px; }
  .oc-title { font-size: 18px; }
  .oc-desc { font-size: 14.5px; }
  .oc-logic { padding: 22px 22px; }
  .oc-logic-txt { font-size: 15px; line-height: 1.65; }

  /* Pricing */
  .pricing-grid { grid-template-columns: 1fr; max-width: 100%; gap: 14px; }
  .price-card { padding: 28px 22px; }
  .price-amt { font-size: 42px; }
  .price-feat li { font-size: 13.5px; padding: 7px 0; }

  /* FAQ */
  .faq { margin-top: 48px; }
  .faq-q { font-size: 14.5px; padding: 14px 16px; gap: 10px; }
  .faq-a { font-size: 14px; padding: 0 16px 16px; }

  /* Whitepaper */
  .wp h3 { font-size: 20px; margin: 36px 0 12px; }
  .wp h4 { font-size: 15px; }
  .wp p { font-size: 15px; }
  .wp-table { font-size: 12px; }
  .wp-table th, .wp-table td { padding: 8px 10px; }

  /* Code blocks */
  .codeblock-body { font-size: 11.5px; padding: 14px; line-height: 1.7; }
  .codeblock-hd { font-size: 11px; padding: 8px 14px; }

  /* Footer */
  .footer { padding: 40px 0 28px; }
  .footer-in { flex-direction: column; text-align: center; gap: 14px; }

  /* Section head centering */
  .sec-head .sec-sub { text-align: center; }
}

/* Small phone: 420px down */
@media (max-width: 420px) {
  .wrap, .wrap-narrow, .wrap-wide { padding: 0 14px; }
  .sec { padding: 48px 0; }
  h1 { font-size: 30px; }
  .sec-title { font-size: 27px; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .hero-stats .hs:nth-child(5) { grid-column: 1 / -1; }
  .flow-node { padding: 12px 10px; }
  .flow-title { font-size: 14px; }
  .flow-sub { font-size: 11.5px; }
  .price-amt { font-size: 36px; }
  .ev-n { font-size: 26px; }
}

// Helpers
function useSR() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add('vis'); ob.disconnect(); } }, {threshold: 0.12});
    ob.observe(el);
    return () => ob.disconnect();
  }, []);
  return ref;
}
function SR({children, className='', delay=''}) {
  const ref = useSR();
  return <div ref={ref} className={`sr ${delay} ${className}`}>{children}</div>;
}

function CopyBtn({text}) {
  const [done, setDone] = useState(false);
  return <button className="copy-btn" onClick={() => {
    navigator.clipboard?.writeText(text);
    setDone(true); setTimeout(() => setDone(false), 1400);
  }}>{done ? '✓ Copied' : 'Copy'}</button>;
}

function Code({lines}) {
  const cls = {c:'cm', k:'kw', s:'st', f:'fn', n:'nu', v:'st', p:'pp'};
  return <>{lines.map((l, i) => <span key={i}><span className={cls[l.t]||'pp'}>{l.v}</span>{"\n"}</span>)}</>;
}

function Research() {
  const [expanded, setExpanded] = useState(false);
  return (
    <section className="sec sec-bg" id="research">
      <div className="wrap">
        <SR>
          <div className="sec-head center">
            <div className="eyebrow" style={{color:'var(--purple)'}}>Research</div>
            <h2 className="sec-title" style={{maxWidth:780}}>Why every credential manager on Linux has the same vulnerability.</h2>
            <p className="sec-sub" style={{maxWidth:640}}>And how two forgotten kernel primitives close it. Written for people who want to verify claims before buying them.</p>
            <div className="wp-meta">
              <span>The Hermetic Project</span>
              <span>April 2026</span>
              <span>~2,600 words · 10 min read</span>
            </div>
          </div>
        </SR>

        <div className="wp">
          <SR>
            <h3>1. The assumption everyone makes</h3>
            <p>Every credential manager on Linux trusts the same boundary: the Unix user ID. If a process runs as your UID, it can connect to your SSH agent socket, read your HashiCorp Vault token, access credentials in your environment variables, and communicate with any daemon you own. This is not a bug in any individual product. It is the shared, unexamined foundation of Linux credential security.</p>
            <p>Major password managers and credential tools document that their SSH agents restrict access solely by file permissions on the agent socket or named pipe. Secret management systems authenticate clients using bearer tokens that carry no process-level identity. CLI credential helpers inject temporary credentials as environment variables readable by any same-UID process via <code>/proc/pid/environ</code>. Products following this pattern include 1Password, HashiCorp Vault, aws-vault, OpenSSH's ssh-agent, and GPG's gpg-agent.</p>
            <p>The reasoning was straightforward and, until recently, correct. If an attacker is already executing code as your user, they can read every file you own — browser cookies, shell history, cloud credentials, SSH keys. Protecting one daemon's socket while every flat file on disk is readable would be security theater. The accepted wisdom: <strong>if they are running code as you, you have already lost.</strong></p>
            <p>This paper argues that this assumption is now wrong, explains why, demonstrates a specific exploit that breaks the most common fix, and describes the correct solution.</p>
          </SR>

          <SR delay="sr-d1">
            <h3>2. What changed: AI agents execute code by design</h3>
            <p>AI coding agents changed the equation. Claude Code, GitHub Copilot, Cursor, Windsurf, and similar tools routinely execute shell commands as the user's UID. This is their intended functionality, not an exploit. The agent reads a task description, generates a shell command, and executes it.</p>
            <p>These agents are susceptible to prompt injection. Attacker-controlled text in a GitHub issue, a code comment, a pull request description, or an API error response can redirect the agent's behavior. A carefully crafted comment can instruct the agent to read credentials from a daemon socket and exfiltrate them.</p>
            <table className="wp-table">
              <thead><tr><th>Precondition</th><th>Before AI agents</th><th>With AI agents</th></tr></thead>
              <tbody>
                <tr><td>Code execution as target UID</td><td>Requires prior compromise</td><td>Default — agents execute shells by design</td></tr>
                <tr><td>Knowledge of daemon protocol</td><td>Requires reverse engineering</td><td>Public source code; agent reads it</td></tr>
                <tr><td>Exploit code generation</td><td>Requires development skill</td><td>Agent generates the exploit in seconds</td></tr>
                <tr><td>Exfiltration channel</td><td>Requires C2 infrastructure</td><td>Agent embeds in its own output</td></tr>
                <tr><td>Vault unlocked during attack</td><td>User must be actively working</td><td>Vault stays unlocked during session</td></tr>
              </tbody>
            </table>
            <p>The supply chain attack vector already demonstrated this pattern. The event-stream npm compromise (2018), the ua-parser-js attack (2021), and the Axios npm supply-chain attack (March 2026, affecting millions of weekly downloads) all executed automated credential theft under the developer's UID. AI agents collapse the attack further: a poisoned comment in a repository the agent is working on is sufficient.</p>
            <div className="wp-callout warn">⚠ Every precondition for same-UID credential theft is the default state for developers using AI coding agents. This is not a theoretical risk. It is the expected operating environment.</div>
          </SR>

          {!expanded && (
            <SR delay="sr-d1">
              <div className="wp-more">
                <button onClick={() => setExpanded(true)}>Continue reading — 5 more sections ↓</button>
              </div>
            </SR>
          )}

          {expanded && (<>
            <SR>
              <h3>3. The obvious fix: binary attestation via /proc/pid/exe</h3>
              <p>The obvious fix is process identity verification. On Linux, the kernel exposes the executable path of any process via <code>/proc/pid/exe</code>, a special symbolic link that resolves to the binary loaded during <code>execve()</code>. Unlike <code>/proc/pid/cmdline</code>, which the process can modify at any time, <code>/proc/pid/exe</code> is set by the kernel and cannot be changed without <code>CAP_SYS_ADMIN</code>.</p>
              <p>A robust implementation opens <code>/proc/peer_pid/exe</code> as a file descriptor, reads the binary contents, and computes a SHA-256 hash. It compares this against its own hash, computed from <code>/proc/self/exe</code> at startup. A hash mismatch means the connecting process is not the expected binary.</p>
              <p>This approach has real precedent. SPIFFE/SPIRE's Unix Workload Attestor uses <code>/proc/pid/exe</code> to identify workloads. Polkit historically used it for authorization decisions. Snapd uses it for snap confinement verification. It works. Until it doesn't.</p>
            </SR>

            <SR delay="sr-d1">
              <h3>4. Two exploits that break binary attestation</h3>
              <h4>4.1 The FD-sharing race</h4>
              <p>Binary attestation via <code>/proc/pid/exe</code> has a time-of-check-to-time-of-use vulnerability. File descriptors survive <code>fork()</code> and <code>exec()</code>. This creates an attack chain:</p>
              <p><strong>Step 1.</strong> The attacker's Python script creates a Unix socket connected to the daemon. <strong>Step 2.</strong> The script calls <code>fork()</code>. The child inherits the socket fd. <strong>Step 3.</strong> The child calls <code>execve()</code> on the legitimate binary — its <code>/proc/pid/exe</code> now points to the real binary. <strong>Step 4.</strong> The parent (still Python) sends an attestation request on the shared socket. <code>SO_PEERCRED</code> returns the child's PID; the daemon reads the child's <code>/proc/pid/exe</code>; hash matches; token issued. <strong>Step 5.</strong> The parent receives the token and has authenticated access.</p>
              <p>During adversarial validation, an AI attack simulation produced a working exploit script that extracted a valid session token. We attempted multiple mitigations including accept-time hashing, challenge-response protocols, and per-PID token binding. All failed because the attacker controls the timing of <code>execve()</code> — the child becomes the legitimate binary before any daemon code runs.</p>
              <div className="wp-callout info">◆ The FD-sharing exploit was discovered and operationalized by an AI adversarial auditor during our security validation — demonstrating that the same AI capabilities that enable prompt-injection attacks can also find and exploit credential infrastructure vulnerabilities.</div>
              <p>This vulnerability class is not new. CVE-2013-4288 in polkit exploited the same TOCTOU pattern, triggering a cascade of seven related CVEs. CVE-2019-5736 in runc exploited <code>/proc/pid/exe</code> in the opposite direction. Yet every credential manager that uses socket-level authentication still relies on <code>SO_PEERCRED</code> alone.</p>

              <h4>4.2 Token theft via /proc/pid/mem</h4>
              <p>There is a subtler attack that survives even after the FD-sharing race is closed. Binary attestation requires the daemon to read <code>/proc/peer_pid/exe</code>. This requires the client's dumpable attribute to be 1. Setting <code>PR_SET_DUMPABLE=0</code> blocks the read. The client must keep <code>DUMPABLE=1</code> during attestation, then set it to 0 after receiving the session token.</p>
              <p>That constraint opens a window. Between process start and attestation completion, the client's <code>/proc/pid/mem</code> is readable by any same-UID process. On Linux, file descriptor permissions are evaluated at open() time. Once granted, subsequent dumpable changes do not revoke the fd. If the session token is a bearer credential — valid from any process, any PID — an attacker who extracts it from memory can present it from their own process and gain full authenticated access.</p>
              <div className="wp-callout warn">⚠ The attestation window that enables binary verification also creates a memory-read window. The defense creates the vulnerability. This tension is inherent to any /proc-based attestation scheme on Linux.</div>
            </SR>

            <SR delay="sr-d1">
              <h3>5. Two fixes, both already in the kernel</h3>
              <h4>5.1 Sender verification: SCM_CREDENTIALS</h4>
              <p>The FD-sharing race exploits a semantic mismatch. <code>SO_PEERCRED</code> answers "who called <code>connect()</code>?" The credentials are recorded once and never updated. After <code>fork()</code>, the parent inherits the fd but <code>SO_PEERCRED</code> still identifies the child.</p>
              <p>The Linux kernel has provided the correct mechanism since version 2.2: <strong>SCM_CREDENTIALS</strong>. When a socket has <code>SO_PASSCRED</code> enabled, the kernel attaches the sender's credentials (PID, UID, GID) to every message via <code>recvmsg()</code>. These are verified by the kernel at send time. Unforgeable without <code>CAP_SYS_ADMIN</code>.</p>
              <p>With this primitive, the daemon can verify on every single incoming message that the sender is the same process that originally connected — not a forked child that inherited the socket. The FD-sharing race closes because the kernel itself refuses to lie about who called <code>sendmsg()</code>.</p>

              <h4>5.2 Token binding: tokens are not bearer credentials</h4>
              <p><code>SCM_CREDENTIALS</code> closes the FD-sharing race but does not close the <code>/proc/pid/mem</code> attack. That attack uses a clean connection with no fd sharing.</p>
              <p>The fix is to bind the token to the process that attested. When the daemon issues a session token, it records the attesting process's PID. On every subsequent request, it compares the presenting PID against the stored PID. A mismatch means someone other than the original attestor is using the token.</p>
              <p>The stolen token becomes worthless. The attacker reads it from memory in one process, presents it from another, and the daemon rejects it because the PIDs differ. Combined with SCM_CREDENTIALS, these close both the FD-sharing race and the memory-theft vector using only kernel primitives.</p>
              <p>The stolen token is now worthless. The attacker reads it from memory (PID Y), presents it from Python (PID X), and the daemon rejects it because X ≠ Y.</p>
              <div className="wp-callout ok">✓ Both fixes use kernel primitives that have existed for decades. SCM_CREDENTIALS: Linux 2.2, January 1999. SO_PEERCRED PID for token binding: available since Unix domain sockets were introduced. The mechanisms that close these vulnerabilities were always there.</div>
            </SR>

            <SR delay="sr-d1">
              <h3>6. Defense in depth</h3>
              <p>Sender verification and PID-bound tokens close two specific vulnerabilities, but a credential daemon on Linux needs more. <strong>PR_SET_DUMPABLE=0</strong> blocks same-UID processes from reading <code>/proc/pid/exe</code>, <code>/proc/pid/mem</code>, <code>/proc/pid/environ</code>, and <code>/proc/pid/fd/</code>. The attestation protocol has to complete before DUMPABLE=0 can be set, which creates a narrow window during which tokens must not yet exist in client memory.</p>
              <p>Beyond the kernel primitives, a hardened daemon needs library-injection defenses to catch LD_PRELOAD attacks, scoped session tokens with narrow TTLs to limit blast radius, and token delivery channels that don't appear in <code>/proc/pid/environ</code> or <code>/proc/pid/cmdline</code>. Each layer handles a class the others cannot.</p>
              <p>No single mechanism is sufficient. Sender verification catches socket-level impersonation. PID binding catches token-level theft. DUMPABLE restrictions catch inspection across the attestation boundary. Scoped tokens limit lateral movement if any component is compromised. These compose into a defense that survives the failure of any single layer.</p>
              <p>These layers raise the cost of same-UID extraction from trivial to substantial — they close the FD-sharing race, token replay, and opportunistic memory scraping. They do not make a same-UID attacker with arbitrary code execution impossible; they shrink the window and the blast radius. The architectural close — running the broker under a separate UID the agent cannot reach — is the next milestone.</p>
            </SR>

            <SR delay="sr-d1">
              <h3>7. What this means for the industry</h3>
              <p>Every credential manager, secret agent, and authentication daemon on Linux that uses Unix domain sockets for local IPC faces these vulnerabilities. The FD-sharing race exploits the gap between who connected and who is sending. The memory-theft attack exploits the attestation window that binary verification requires. Both are closed by kernel primitives that have existed for decades.</p>
              <p>The fixes are not complex. Sender verification uses SCM_CREDENTIALS, a kernel primitive available since Linux 2.2. Token binding uses the PID returned by SO_PEERCRED, available since Unix domain sockets were introduced. Any daemon exposing a Unix socket can adopt both.</p>
              <p>We discovered these vulnerabilities while building Hermetic, a credential isolation daemon for AI agents. The cryptographic core and the transport layer are open source. The adversarial validation that found both exploits and the kernel-level fixes are documented in the source code.</p>
            </SR>
          </>)}

          <SR delay="sr-d1">
            <div className="wp-dl-wrap">
              <a className="wp-dl" href="https://github.com/hermetic-sys/hermetic" target="_blank" rel="noopener">View on GitHub →</a>
            </div>
          </SR>
        </div>
      </div>
    </section>
  );
}

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('hermetic-theme', theme); } catch {}
  }, [theme]);

  useEffect(() => {
    const ids = [...SECTIONS.map(s => s.id), 'problem', 'install', 'contact'];
    const on = () => {
      let current = null;
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.top <= 140 && r.bottom > 140) { current = id; break; }
      }
      setSection(current);
    };
    on();
    window.addEventListener('scroll', on, {passive:true});
    return () => window.removeEventListener('scroll', on);
  }, []);

  const navTo = (id) => {
    if (!id) { window.scrollTo({top:0, behavior:'smooth'}); return; }
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };
  const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  return (<>
    <Nav section={section} navTo={navTo} theme={theme} toggle={toggle} />
    <Hero />
    <Problem />
    <Mechanism />
    <Coverage />
    <Proxy />
    <Architecture />
    <Evidence />
    <Research />
    <OpenCore />
    <Install />
    <Pricing />
    <Contact />
    <Footer />
  </>);
}

ReactDOM.render(<App />, document.getElementById('root'));

</script>
</body>
</html>
